// =======================
// ID
// =======================
const kundeId =
  new URLSearchParams(
    window.location.search
  ).get("id");

let currentCustomer = null;
let customerActivityItems = [];
let customerActivityFilter = "all";
let customerMediaRecorder = null;
let customerAudioChunks = [];
let customerVoiceSession = null;

function escapeHtml(value) {
  return String(value || "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[char]));
}

function setCustomerVoiceStatus(text, ok) {
  const el =
    document.getElementById(
      "customerVoiceStatus"
    );

  if(!el) return;

  el.textContent =
    text || "";

  el.style.color =
    ok === false
      ? "#ff6b3d"
      : "#9be15d";
}

async function startCustomerRecording() {
  const transcript =
    document.getElementById(
      "customerVoiceTranscript"
    );

  if(transcript) transcript.value = "";

  if(window.BautrailVoiceNotes) {
    customerVoiceSession =
      window.BautrailVoiceNotes
        .startSpeechToText({
          onText:text => {
            const field =
              document.getElementById(
                "customerVoiceTranscript"
              );
            if(field) field.value = text;
          },
          onStatus:text => setCustomerVoiceStatus(text, true)
        });
  }

  const stream =
    await navigator.mediaDevices
      .getUserMedia({ audio:true });

  customerMediaRecorder =
    new MediaRecorder(stream);

  customerAudioChunks = [];

  customerMediaRecorder.ondataavailable =
    event => {
      customerAudioChunks.push(event.data);
    };

  customerMediaRecorder.onstop =
    async () => {
      const audioBlob =
        new Blob(customerAudioChunks, {
          type:"audio/webm"
        });

      const player =
        document.getElementById(
          "customerAudioPlayer"
        );

      if(player) {
        player.src =
          URL.createObjectURL(audioBlob);
        player.style.display = "block";
      }

      await saveCustomerVoiceNote(audioBlob);
    };

  customerMediaRecorder.start();
}

function stopCustomerRecording() {
  if(customerVoiceSession) {
    customerVoiceSession.stop();
    customerVoiceSession = null;
  }

  if(customerMediaRecorder) {
    customerMediaRecorder.stop();
  }
}

async function saveCustomerVoiceNote(audioBlob) {
  if(!window.BautrailVoiceNotes) return;

  const transcript =
    document.getElementById(
      "customerVoiceTranscript"
    );

  const text =
    transcript
      ? transcript.value.trim()
      : "";

  const result =
    await window.BautrailVoiceNotes
      .saveVoiceNote({
        audioBlob,
        customer_id:kundeId,
        transcript:text,
        note_text:text,
        filePrefix:"kunde-" + kundeId,
        source:"customer-audio"
      });

  if(result.error) {
    console.log(result.error);
    setCustomerVoiceStatus(
      "Sprachnotiz konnte nicht gespeichert werden.",
      false
    );
    return;
  }

  setCustomerVoiceStatus(
    "Sprachnotiz gespeichert.",
    true
  );

  await loadCustomerVoiceNotes();
  await loadCustomerDossier();
}

async function loadCustomerVoiceNotes() {
  const list =
    document.getElementById(
      "customerVoiceNoteList"
    );

  if(!list || !window.BautrailVoiceNotes) return;

  const notes =
    await window.BautrailVoiceNotes
      .loadVoiceNotes({
        customer_id:kundeId,
        limit:8
      });

  if(!notes.length) {
    list.innerHTML =
      "<p style='opacity:0.7;'>Noch keine Sprachnotizen.</p>";
    return;
  }

  list.innerHTML = "";

  for(const note of notes) {
    const url =
      await window.BautrailVoiceNotes
        .resolveAudioUrl(note);

    const div =
      document.createElement("div");

    div.className = "info-box";
    div.style.marginBottom = "8px";
    div.innerHTML = `
      <small>${new Date(note.created_at).toLocaleString("de-DE")}</small>
      <div class="text">${escapeHtml(note.note_text || note.transcript || "Ohne Text")}</div>
      ${
        url
        ? `<audio controls style="width:100%;margin-top:8px;" src="${url}"></audio>`
        : ""
      }
    `;

    list.appendChild(div);
  }
}

// =======================
// SYNC ALLES
// =======================
async function syncAll() {

  if (!navigator.onLine) return;

  // =======================
  // CREATE SYNC
  // =======================
  let createQ = getCreateQueue();

  let syncedIds = [];

  for (let p of createQ) {

    // nur offline projekte
    if (
      !String(p.id).startsWith("offline_")
    ) {
      continue;
    }

    const { data, error } = await db
      .from("projects")
      .insert([{
        customer_id: p.customer_id,
        name: p.name,
        ort: p.ort,
        datum: p.datum,
        beschreibung: p.beschreibung || ""
      }])
      .select()
      .single();

    if (error) {

      console.log(error);
      continue;
    }

    const newId = data.id;

    syncedIds.push(p.id);

    // =======================
    // UPDATE QUEUE FIX
    // =======================
    let updates =
      getUpdateQueue();

    updates = updates.map(u => {

      if (
        String(u.id) === String(p.id)
      ) {

        return {
          ...u,
          id: newId
        };
      }

      return u;
    });

    saveUpdateQueue(updates);

    // =======================
    // IMAGE QUEUE FIX
    // =======================
    let uploads =
      JSON.parse(
        localStorage.getItem(
          "offlineUploads"
        )
      ) || [];

    uploads = uploads.map(img => {

      if (
        String(img.project_id)
        === String(p.id)
      ) {

        return {
          ...img,
          project_id: newId
        };
      }

      return img;
    });

    localStorage.setItem(
      "offlineUploads",
      JSON.stringify(uploads)
    );

    if (window.BaudokuDocuments) {
      await window.BaudokuDocuments.migrateProjectId(
        p.id,
        newId
      );
    }

    // =======================
    // CACHE FIX
    // =======================
    let cached =
      JSON.parse(
        localStorage.getItem(
          "projects_" + kundeId
        )
      ) || [];

    cached = cached.map(project => {

      if (
        String(project.id)
        === String(p.id)
      ) {

        return {
          ...project,
          id: newId
        };
      }

      return project;
    });

    localStorage.setItem(
      "projects_" + kundeId,
      JSON.stringify(cached)
    );
  }

  // nur synchronisierte entfernen
  createQ = createQ.filter(p => {

    return !syncedIds.includes(p.id);
  });

  saveCreateQueue(createQ);

  // =======================
  // UPDATE SYNC
  // =======================
  let updateQ =
    getUpdateQueue();

  const remainingUpdates = [];

  for (let u of updateQ) {

    const { data, error } =
      await db
      .from("projects")
      .update({
        [u.field]: u.value
      })
      .eq("id", u.id)
      .select("id")
      .maybeSingle();

    if (error || !data) {

      console.log(error);

      remainingUpdates.push(u);
    }
  }

  saveUpdateQueue(remainingUpdates);

  if (window.BaudokuDocuments) {
    await window.BaudokuDocuments.syncAll();
  }

  // =======================
  // DELETE SYNC
  // =======================
  let deleteQ =
    getDeleteQueue();

  for (let id of deleteQ) {

    await db
      .from("projects")
      .delete()
      .eq("id", id);
  }

  localStorage.removeItem(
    "deleteQueue"
  );

  console.log(
    "Alles synchronisiert ?"
  );
}

// =======================
// KUNDE LADEN
// =======================
async function loadCustomer() {

  // OFFLINE
  if (!navigator.onLine) {

    const cached =
      JSON.parse(
        localStorage.getItem(
          "customer_" + kundeId
        )
      );

    if (cached) {

      fillCustomer(cached);
      return;
    }
  }

  // ONLINE
  const { data, error } = await db
    .from("customers")
    .select("*")
    .eq("id", kundeId)
    .single();

  if (error) {

    console.log(error);
    return;
  }

  // CACHE
  localStorage.setItem(
    "customer_" + kundeId,
    JSON.stringify(data)
  );

  fillCustomer(data);
}

// =======================
// KUNDE ANZEIGEN
// =======================
function fillCustomer(kunde) {

  currentCustomer = kunde;

  const name =
    kunde.firma ||
    (
      kunde.vorname &&
      kunde.nachname
        ? kunde.vorname +
          " " +
          kunde.nachname
        : "Unbekannt"
    );

  document.getElementById(
    "kundeName"
  ).textContent = name;

  document.getElementById(
    "kundeInfo"
  ).innerHTML = `
    ${kunde.adresse || ""}<br>
    ${kunde.telefon || ""}<br>
    ${kunde.email || ""}<br>
    ${
      kunde.ansprechpartner
        ? "Ansprechpartner: " +
          kunde.ansprechpartner
        : ""
    }
  `;

  document.getElementById("editFirma").value =
    kunde.firma || "";

  document.getElementById("editAnsprechpartner").value =
    kunde.ansprechpartner || "";

  document.getElementById("editVorname").value =
    kunde.vorname || "";

  document.getElementById("editNachname").value =
    kunde.nachname || "";

  document.getElementById("editTelefon").value =
    kunde.telefon || "";

  document.getElementById("editEmail").value =
    kunde.email || "";

  document.getElementById("editAdresse").value =
    kunde.adresse || "";

  if (window.BaudokuAutoTextareas) {
    window.BaudokuAutoTextareas.init();
  }
}

async function saveCustomerChanges() {

  const status =
    document.getElementById(
      "customerSaveStatus"
    );

  const payload = {
    firma: document.getElementById("editFirma").value.trim(),
    ansprechpartner: document.getElementById("editAnsprechpartner").value.trim(),
    vorname: document.getElementById("editVorname").value.trim(),
    nachname: document.getElementById("editNachname").value.trim(),
    telefon: document.getElementById("editTelefon").value.trim(),
    email: document.getElementById("editEmail").value.trim(),
    adresse: document.getElementById("editAdresse").value.trim()
  };

  if (!payload.firma && (!payload.vorname || !payload.nachname)) {
    status.textContent =
      "Bitte Firma oder Vor- und Nachname eintragen.";
    status.style.color = "#ff3b3b";
    return;
  }

  const { data, error } =
    await db
    .from("customers")
    .update(payload)
    .eq("id", kundeId)
    .select()
    .single();

  if (error) {
    console.log(error);
    status.textContent =
      "Kunde konnte nicht gespeichert werden.";
    status.style.color = "#ff3b3b";
    return;
  }

  localStorage.setItem(
    "customer_" + kundeId,
    JSON.stringify(data)
  );

  fillCustomer(data);

  status.textContent =
    "Kunde gespeichert.";

  status.style.color =
    "#4caf50";
}

async function buildCustomerTrashPayload() {

  const customer =
    currentCustomer;

  const { data: projects } =
    await db
      .from("projects")
      .select("*")
      .eq("customer_id", kundeId);

  const projectIds =
    (projects || []).map(project => project.id);

  const { data: jobs } =
    await db
      .from("auftraege")
      .select("*")
      .eq("customer_id", kundeId);

  const jobIds =
    (jobs || []).map(job => job.id);

  const [
    materialResult,
    imagesResult,
    documentsResult,
    foldersResult,
    audioResult
  ] = await Promise.all([
    jobIds.length
      ? db.from("auftrag_material").select("*").in("auftrag_id", jobIds)
      : Promise.resolve({ data: [] }),
    projectIds.length
      ? db.from("project_images").select("*").in("project_id", projectIds)
      : Promise.resolve({ data: [] }),
    projectIds.length
      ? db.from("project_documents").select("*").in("project_id", projectIds)
      : Promise.resolve({ data: [] }),
    projectIds.length
      ? db.from("project_folders").select("*").in("project_id", projectIds)
      : Promise.resolve({ data: [] }),
    projectIds.length
      ? db.from("project_audio").select("*").in("project_id", projectIds)
      : Promise.resolve({ data: [] })
  ]);

  return {
    customer,
    projects: projects || [],
    jobs: jobs || [],
    material: materialResult.data || [],
    images: imagesResult.data || [],
    documents: documentsResult.data || [],
    folders: foldersResult.data || [],
    audio: audioResult.data || []
  };
}

async function buildProjectTrashPayload(projectId) {

  const { data: project } =
    await db

      .eq("id", projectId)
      .single();

  const { data: jobs } =
    await db
      .from("auftraege")
      .select("*")
      .eq("project_id", projectId);

  const jobIds =
    (jobs || []).map(job => job.id);

  const [
    materialResult,
    imagesResult,
    documentsResult,
    foldersResult,
    audioResult
  ] = await Promise.all([
    jobIds.length
      ? db.from("auftrag_material").select("*").in("auftrag_id", jobIds)
      : Promise.resolve({ data: [] }),
    db.from("project_images").select("*").eq("project_id", projectId),
    db.from("project_documents").select("*").eq("project_id", projectId),
    db.from("project_folders").select("*").eq("project_id", projectId),
    db.from("project_audio").select("*").eq("project_id", projectId)
  ]);

  return {
    project,
    jobs: jobs || [],
    material: materialResult.data || [],
    images: imagesResult.data || [],
    documents: documentsResult.data || [],
    folders: foldersResult.data || [],
    audio: audioResult.data || []
  };
}

async function deleteCustomer() {

  const typed =
    prompt(
      "Zum Löschen bitte BESTAeTIGEN eingeben."
    );

  if (
    typed !== "BESTAETIGEN" &&
    typed !== "BESTAeTIGEN"
  ) {
    alert("Kunde wurde nicht gelöscht.");
    return;
  }

  const snapshot =
    await buildCustomerTrashPayload();

  const projectIds =
    (snapshot.projects || [])
    .map(project => project.id);

  const jobIds =
    (snapshot.jobs || [])
    .map(job => job.id);

  if (window.BaudokuTrash) {
    await window.BaudokuTrash.archiveItem({
      item_type: "customer",
      source_id: kundeId,
      title: document.getElementById("kundeName").textContent || "Kunde",
      payload: snapshot
    });
  }

  if (jobIds.length) {
    await db
      .from("auftrag_material")
      .delete()
      .in("auftrag_id", jobIds);
  }

  if (projectIds.length) {
    await db
      .from("project_audio")
      .delete()
      .in("project_id", projectIds);

    await db
      .from("project_documents")
      .delete()
      .in("project_id", projectIds);

    await db
      .from("project_images")
      .delete()
      .in("project_id", projectIds);

    await db
      .from("project_folders")
      .delete()
      .in("project_id", projectIds);
  }

  await db
    .from("auftraege")
    .delete()
    .eq("customer_id", kundeId);

  await db
    .from("projects")
    .delete()
    .eq("customer_id", kundeId);

  const { error } =
    await db
    .from("customers")
    .delete()
    .eq("id", kundeId);

  if (error) {
    console.log(error);
    alert(error.message);
    return;
  }

  localStorage.removeItem(
    "customer_" + kundeId
  );

  localStorage.removeItem(
    "projects_" + kundeId
  );

  window.location.href =
    "kunden.html";
}

// =======================
// PROJEKTE LADEN
// =======================
async function loadProjects() {

  let data = [];

  // =======================
  // OFFLINE
  // =======================
  if (!navigator.onLine) {

    const cached =
      JSON.parse(
        localStorage.getItem(
          "projects_" + kundeId
        )
      ) || [];

    const offline =
      getCreateQueue()
      .filter(
        p =>
          p.customer_id === kundeId
      );

    const deleted =
      getDeleteQueue();

    data = [
      ...offline,
      ...cached
    ];

    // doppelte entfernen
    data = data.filter(
      (project, index, self) => {

        return index ===
          self.findIndex(p =>
            String(p.id)
            === String(project.id)
          );
      }
    );

    // gelöschte ausblenden
    data = data.filter(
      p =>
        !deleted.includes(p.id)
    );

    renderProjects(data);
    loadCustomerDossier();
    loadCustomerCircuitPlans();

    return;
  }

  // =======================
  // ONLINE
  // =======================
  await syncAll();

  const {
    data: dbData,
    error
  } = await db
    .from("projects")
    .select("*")
    .eq(
      "customer_id",
      kundeId
    )
    .order(
      "created_at",
      {
        ascending: false
      }
    );

  if (error) {

    console.log(error);
    return;
  }

  data = dbData || [];

  // offline projekte behalten
  const offline =
    getCreateQueue()
    .filter(
      p =>
        p.customer_id === kundeId
    );

  offline.forEach(p => {

    const exists =
      data.find(d =>
        String(d.id)
        === String(p.id)
      );

    if (!exists) {

      data.unshift(p);
    }
  });

  // doppelte entfernen
  data = data.filter(
    (project, index, self) => {

      return index ===
        self.findIndex(p =>
          String(p.id)
          === String(project.id)
        );
    }
  );

  // CACHE
  localStorage.setItem(
    "projects_" + kundeId,
    JSON.stringify(data)
  );

  renderProjects(data);
  loadCustomerDossier();
  loadCustomerReports();
  loadCustomerCircuitPlans();
}

async function deleteProject(id) {

  // OFFLINE
  if (!navigator.onLine) {

    let q =
      getDeleteQueue();

    q.push(id);

    saveDeleteQueue(q);

    alert(
      "Offline gelöscht"
    );

    loadProjects();

    return;
  }

  const snapshot =
    await buildProjectTrashPayload(id);

  if (window.BaudokuTrash) {
    await window.BaudokuTrash.archiveItem({
      item_type: "project",
      source_id: id,
      title: snapshot.project && snapshot.project.name
        ? snapshot.project.name
        : "Projekt",
      payload: snapshot
    });
  }

  const jobIds =
    (snapshot.jobs || []).map(job => job.id);

  if (jobIds.length) {
    await db
      .from("auftrag_material")
      .delete()
      .in("auftrag_id", jobIds);
  }

  await db
    .from("project_audio")
    .delete()
    .eq("project_id", id);

  await db
    .from("project_documents")
    .delete()
    .eq("project_id", id);

  await db
    .from("project_images")
    .delete()
    .eq("project_id", id);

  await db
    .from("project_folders")
    .delete()
    .eq("project_id", id);

  await db
    .from("auftraege")
    .delete()
    .eq("project_id", id);

  // ONLINE
  await db
    .from("projects")
    .delete()
    .eq("id", id);

  loadProjects();
  loadCustomerDossier();
}

function renderProjects(projects) {

  const list =
    document.getElementById(
      "projektList"
    );

  list.innerHTML = "";

  projects.forEach(p => {
    const isOfflineOnly =
      String(p.id || "").startsWith("offline_");

    const pendingUpdates =
      getUpdateQueue().some(item => String(item.id) === String(p.id));

    const pendingDelete =
      getDeleteQueue().some(id => String(id) === String(p.id));

    const offlineLabel =
      pendingDelete
        ? "Wird gelöscht"
        : isOfflineOnly
          ? "Nur lokal"
          : pendingUpdates
            ? "Aenderungen offen"
            : "Synchron";

    const div =
      document.createElement("div");

    div.className =
      "task-card";

    div.style.cursor =
      "pointer";

    div.innerHTML = `
      <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:10px;
      ">

        <div style="flex:1;">
          <strong>${p.name}</strong><br>
          <small>${p.ort || ""}</small><br>
          <small style="opacity:0.7;">${offlineLabel}</small>
        </div>

        <button
          onclick="
            event.stopPropagation();
            deleteProject('${p.id}')
          "
          style="
            background:#ff3b3b;
            color:white;
            border:none;
            border-radius:8px;
            padding:6px 10px;
            cursor:pointer;
          "
        >
          X
        </button>

      </div>
    `;

    div.onclick = () => {

      window.location.href =
        "projekt-detail.html?id="
        + p.id;
    };

    list.appendChild(div);
  });
}

function renderAkteStats(stats) {

  const target =
    document.getElementById("akteStats");

  if (!target) return;

  const items = [
    { label: "Projekte", value: stats.projects },
    { label: "Auftraege", value: stats.jobs },
    { label: "Nachweise", value: stats.reports },
    { label: "Bilder", value: stats.images },
    { label: "Dateien", value: stats.documents },
    { label: "Offen", value: stats.openJobs }
  ];

  target.innerHTML =
    items.map(item => `
      <div class="info-box" style="margin-top:0;min-height:0;">
        <small>${item.label}</small>
        <div class="text" style="font-size:20px;font-weight:700;">${item.value}</div>
      </div>
    `).join("");

  const overview = document.getElementById("akteOverview");
  if (!overview) return;
  overview.innerHTML = `
    <div class="info-box" style="margin-top:0;min-height:0;">
      <small>Schnellueberblick</small>
      <div class="text">${stats.lastAction || "Noch keine Aktivitaet"}</div>
      <small>Letzter Einsatz: ${stats.lastWorkDate || "-"} | Letzter Nachweis: ${stats.lastReportDate || "-"}</small>
    </div>
  `;
}

function renderActivityFilters() {
  const host = document.getElementById("activityFilters");
  if (!host) return;
  const filters = [
    { key: "all", label: "Alles" },
    { key: "report", label: "Nachweise" },
    { key: "job", label: "Auftraege" },
    { key: "project", label: "Projekte" },
    { key: "document", label: "Dateien" },
    { key: "image", label: "Bilder" },
    { key: "note", label: "Notizen" }
  ];

  host.innerHTML =
    filters.map(filter => {
      const active = customerActivityFilter === filter.key;
      return `<button class="login-btn" style="width:auto;margin:0;padding:8px 10px;background:${active ? "#ff6b3d" : "#444"};" onclick="setCustomerActivityFilter('${filter.key}')">${filter.label}</button>`;
    }).join("");
}

window.setCustomerActivityFilter = function(filter) {
  customerActivityFilter = filter || "all";
  renderActivity(customerActivityItems);
};

window.openCustomerActivity = function(kind, id) {
  if (!id) return;
  if (kind === "project") window.location.href = "projekt-detail.html?id=" + id;
  else if (kind === "job") window.location.href = "auftrag-detail.html?id=" + id;
  else if (kind === "report") window.location.href = "stunden-nachweis.html";
  else if (kind === "circuit") openCustomerCircuitPlan(id);
};

function renderActivity(items) {

  const list =
    document.getElementById("activityList");

  if (!list) return;

  renderActivityFilters();

  const visible =
    (items || []).filter(item => customerActivityFilter === "all" || item.filterKey === customerActivityFilter);

  if (!visible.length) {
    list.innerHTML =
      "<p style='opacity:0.7;'>Keine passenden Eintraege gefunden.</p>";
    return;
  }

  list.innerHTML =
    visible.map(item => {
      const openAttr = item.hrefKind ? `onclick="openCustomerActivity('${item.hrefKind}', '${item.hrefId || ""}')"` : "";
      const cursor = item.hrefKind ? "pointer" : "default";
      return `
      <div class="info-box" style="margin-top:0;margin-bottom:8px;min-height:0;cursor:${cursor};" ${openAttr}>
        <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;">
          <div>
            <small>${escapeHtml(item.type)}</small>
            <div class="text">${escapeHtml(item.label)}</div>
            <small>${escapeHtml(item.meta || "")}</small>
          </div>
          <small style="white-space:nowrap;opacity:0.7;">${new Date(item.created_at).toLocaleString("de-DE")}</small>
        </div>
      </div>
    `;}).join("");
}
async function loadCustomerDossier() {

  if (!navigator.onLine) {
    renderAkteStats({
      projects: 0,
      jobs: 0,
      reports: 0,
      documents: 0,
      images: 0,
      openJobs: 0,
      lastAction: "Offline nicht verfuegbar",
      lastWorkDate: "-",
      lastReportDate: "-"
    });
    customerActivityItems = [];
    renderActivity([]);
    return;
  }

  const { data: projects } =
    await db
      .from("projects")
      .select("id, name, created_at, beschreibung, ort, datum")
      .eq("customer_id", kundeId);

  const projectIds =
    (projects || []).map(project => project.id);

  const { data: jobs } =
    await db
      .from("auftraege")
      .select("id, project, customer, created_at, erledigt_am, beschreibung, faelligkeit, status")
      .eq("customer_id", kundeId);

  const { data: reports } =
    await db
      .from("stundennachweise")
      .select("id, project, customer, objekt, created_at, arbeitsdatum, stunden, gefahrene_kilometer")
      .eq("customer_id", kundeId)
      .is("deleted_at", null);

  const [documentsResult, imagesResult, audioResult, voiceNotesResult, circuitPlansResult] =
    await Promise.all([
      projectIds.length
        ? db.from("project_documents").select("id, file_name, created_at, project_id").in("project_id", projectIds)
        : Promise.resolve({ data: [] }),
      projectIds.length
        ? db.from("project_images").select("id, created_at, project_id").in("project_id", projectIds)
        : Promise.resolve({ data: [] }),
      projectIds.length
        ? db.from("project_audio").select("id, created_at, project_id").in("project_id", projectIds)
        : Promise.resolve({ data: [] }),
      db.from("voice_notes").select("id, created_at, customer_id, project_id, auftrag_id, note_text, transcript").eq("customer_id", kundeId),
      db.from("circuit_plans").select("id,title,updated_at").eq("customer_id", kundeId)
    ]);

  const projectMap = new Map(
    (projects || []).map(project => [String(project.id), project.name || "Projekt"])
  );

  const openJobs = (jobs || []).filter(job => !job.erledigt_am && String(job.status || "").toLowerCase() !== "abgerechnet").length;
  const latestAction = [
    ...(projects || []).map(item => ({ label: "Projekt: " + (item.name || "Projekt"), at: item.created_at || item.datum })),
    ...(jobs || []).map(item => ({ label: "Auftrag: " + (item.project || "Auftrag"), at: item.erledigt_am || item.created_at })),
    ...(reports || []).map(item => ({ label: "Nachweis: " + (item.objekt || item.project || "Nachweis"), at: item.created_at || item.arbeitsdatum }))
  ].filter(item => item.at).sort((a, b) => new Date(b.at) - new Date(a.at))[0];

  renderAkteStats({
    projects: (projects || []).length,
    jobs: (jobs || []).length,
    reports: (reports || []).length,
    documents:
      (documentsResult.data || []).length +
      (audioResult.data || []).length +
      (voiceNotesResult.data || []).length +
      (circuitPlansResult.data || []).length,
    images: (imagesResult.data || []).length,
    openJobs,
    lastAction: latestAction ? latestAction.label : "Noch keine Aktivitaet",
    lastWorkDate: (jobs || []).map(item => item.faelligkeit).filter(Boolean).sort().reverse()[0] || "-",
    lastReportDate: (reports || []).map(item => item.arbeitsdatum || String(item.created_at || "").slice(0, 10)).filter(Boolean).sort().reverse()[0] || "-"
  });

  const activity = [];

  (projects || []).forEach(project => {
    activity.push({
      type: "Projekt",
      filterKey: "project",
      label: project.name || "Projekt angelegt",
      meta: [project.ort || "", project.datum || ""].filter(Boolean).join(" | "),
      created_at: project.created_at || project.datum || new Date().toISOString(),
      hrefKind: "project",
      hrefId: project.id
    });
    if (project.beschreibung) {
      activity.push({
        type: "Notiz",
        filterKey: "note",
        label: "Projektnotiz",
        meta: project.beschreibung,
        created_at: project.created_at || project.datum || new Date().toISOString(),
        hrefKind: "project",
        hrefId: project.id
      });
    }
  });

  (jobs || []).forEach(job => {
    activity.push({
      type: job.erledigt_am ? "Auftrag erledigt" : "Auftrag",
      filterKey: "job",
      label: (job.project || "Auftrag") + " - " + (job.customer || ""),
      meta: [job.faelligkeit || "", job.status || "offen"].filter(Boolean).join(" | "),
      created_at: job.erledigt_am || job.created_at || new Date().toISOString(),
      hrefKind: "job",
      hrefId: job.id
    });
    if (job.beschreibung) {
      activity.push({
        type: "Notiz",
        filterKey: "note",
        label: "Auftragsnotiz",
        meta: job.beschreibung,
        created_at: job.created_at || new Date().toISOString(),
        hrefKind: "job",
        hrefId: job.id
      });
    }
  });

  (reports || []).forEach(report => {
    activity.push({
      type: "Stundennachweis",
      filterKey: "report",
      label: (report.objekt || report.project || "Nachweis") + " - " + (report.customer || ""),
      meta: [report.arbeitsdatum || "", (report.stunden || 0) + " Std.", report.gefahrene_kilometer ? (report.gefahrene_kilometer + " km") : ""].filter(Boolean).join(" | "),
      created_at: report.created_at || report.arbeitsdatum || new Date().toISOString(),
      hrefKind: "report",
      hrefId: report.id
    });
  });

  (documentsResult.data || []).forEach(file => {
    activity.push({
      type: "Dokument",
      filterKey: "document",
      label: (file.file_name || "Dokument") + " - " + (projectMap.get(String(file.project_id)) || "Projekt"),
      meta: "PDF / Datei",
      created_at: file.created_at || new Date().toISOString(),
      hrefKind: "project",
      hrefId: file.project_id
    });
  });

  (imagesResult.data || []).forEach(image => {
    activity.push({
      type: "Bild",
      filterKey: "image",
      label: "Bild hochgeladen - " + (projectMap.get(String(image.project_id)) || "Projekt"),
      meta: "Bilddokumentation",
      created_at: image.created_at || new Date().toISOString(),
      hrefKind: "project",
      hrefId: image.project_id
    });
  });

  (audioResult.data || []).forEach(audio => {
    activity.push({
      type: "Audio",
      filterKey: "document",
      label: "Sprachtext gespeichert - " + (projectMap.get(String(audio.project_id)) || "Projekt"),
      meta: "Audio",
      created_at: audio.created_at || new Date().toISOString(),
      hrefKind: "project",
      hrefId: audio.project_id
    });
  });

  (voiceNotesResult.data || []).forEach(note => {
    activity.push({
      type: "Sprachnotiz",
      filterKey: "note",
      label: note.note_text || note.transcript || "Sprachnotiz gespeichert",
      meta: note.auftrag_id ? "Auftrag" : note.project_id ? "Projekt" : "Kunde",
      created_at: note.created_at || new Date().toISOString(),
      hrefKind: note.auftrag_id ? "job" : note.project_id ? "project" : "",
      hrefId: note.auftrag_id || note.project_id || ""
    });
  });

  (circuitPlansResult.data || []).forEach(plan => {
    activity.push({
      type: "Schaltplan",
      filterKey: "document",
      label: plan.title || "Schaltplan",
      meta: "Zeichnung",
      created_at: plan.updated_at || new Date().toISOString(),
      hrefKind: "circuit",
      hrefId: plan.id
    });
  });

  activity.sort((a, b) =>
    new Date(b.created_at) - new Date(a.created_at)
  );

  customerActivityItems = activity;
  renderActivity(activity);
}
async function loadCustomerReports() {

  const list =
    document.getElementById("stundenList");

  if (!list) return;

  if (!navigator.onLine) {
    list.innerHTML =
      "<p style='opacity:0.7;'>Stundennachweise werden online geladen.</p>";
    return;
  }

  const { data, error } =
    await db
      .from("stundennachweise")
      .select("*")
      .eq("customer_id", kundeId)
      .order("created_at", { ascending: false })
      .limit(6);

  if (error) {
    console.log(error);
    list.innerHTML =
      "<p style='opacity:0.7;'>Stundennachweise konnten nicht geladen werden.</p>";
    return;
  }

  if (!(data || []).length) {
    list.innerHTML =
      "<p style='opacity:0.7;'>Noch keine Stundennachweise vorhanden.</p>";
    return;
  }

  list.innerHTML =
    (data || []).map(item => `
      <div class="info-box" style="margin-top:0;margin-bottom:8px;min-height:0;">
        <small>${item.arbeitsdatum || "-"}</small>
        <div class="text">${item.objekt || "Objekt"} - ${item.project || ""}</div>
        <small>${item.stunden || 0} Std. | ${item.unterschrift_name || "ohne Name"}</small>
      </div>
    `).join("");
}

async function loadCustomerCircuitPlans() {

  const list =
    document.getElementById("circuitPlanList");

  if (!list) return;

  if (!navigator.onLine) {
    list.innerHTML =
      "<p style='opacity:0.7;'>Schaltpl&auml;ne werden online geladen.</p>";
    return;
  }

  const { data, error } =
    await db
      .from("circuit_plans")
      .select("id,title,updated_at,plan_data")
      .eq("customer_id", kundeId)
      .order("updated_at", { ascending: false })
      .limit(10);

  if (error) {
    console.log(error);
    list.innerHTML =
      "<p style='opacity:0.7;'>Schaltpl&auml;ne konnten nicht geladen werden.</p>";
    return;
  }

  if (!(data || []).length) {
    list.innerHTML =
      "<p style='opacity:0.7;'>Noch keine Schaltpl&auml;ne f&uuml;r diesen Kunden.</p>";
    return;
  }

  list.innerHTML =
    (data || []).map(plan => {
      const pages =
        plan.plan_data && Array.isArray(plan.plan_data.pages)
          ? plan.plan_data.pages.length
          : 1;
      return `
      <div class="info-box" style="margin-top:0;margin-bottom:8px;min-height:0;cursor:pointer;" onclick="openCustomerCircuitPlan('${plan.id}')">
        <small>${new Date(plan.updated_at || Date.now()).toLocaleString("de-DE")}</small>
        <div class="text">${escapeHtml(plan.title || "Schaltplan")}</div>
        <small>${pages} Blatt</small>
      </div>
    `;}).join("");
}
