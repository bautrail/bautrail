 font-size:15px;

<script>

const jobId =
  new URLSearchParams(
    window.location.search
  ).get("id");

let currentJob = null;
let projektId = null;
let employees = [];

loadJob();
renderFavoriteMaterials();
loadEmployees();

function openJobReport() {
  const params = new URLSearchParams();
  params.set("auftrag_id", jobId);
  if (currentJob && currentJob.customer_id) params.set("customer_id", currentJob.customer_id);
  if (currentJob && currentJob.project_id) params.set("project_id", currentJob.project_id);
  window.location.href = "stunden-nachweis.html?" + params.toString();
}

function openJobCircuitPlan() {
  const params = new URLSearchParams();
  params.set("auftrag_id", jobId);
  if (currentJob && currentJob.customer_id) params.set("customer_id", currentJob.customer_id);
  if (currentJob && currentJob.project_id) params.set("project_id", currentJob.project_id);
  window.location.href = "schaltplan-zeichner.html?" + params.toString();
}

function renderFavoriteMaterials(){

  const target =
    document.getElementById("favoriteMaterialList");

  if(!target || !window.BaudokuPresets) return;

  const favorites =
    window.BaudokuPresets.getMaterialFavorites();

  target.innerHTML = "";

  favorites.forEach(item => {
    const button =
      document.createElement("button");

    button.type = "button";
    button.className = "result-item";
    button.style.margin = "0";
    button.style.padding = "8px 10px";
    button.style.width = "auto";
    button.textContent = item;

    button.onclick = () => {
      const input =
        document.getElementById("materialInput");

      input.value = item;
    };

    target.appendChild(button);
  });
}

function saveMaterialFavoriteFromJob(){

  const value =
    document.getElementById("materialInput").value.trim();

  if(!value || !window.BaudokuPresets) return;

  window.BaudokuPresets.saveMaterialFavorite(value);
  renderFavoriteMaterials();
}

async function loadJob(){

  const { data: job, error } =
    await db
    .from("auftraege")
    .select("*")
    .eq("id", jobId)
    .single();

  if(error || !job){

    alert("Auftrag nicht gefunden");

    window.location.href =
      "auftraege.html";

    return;
  }

  document.getElementById(
  "project"
).textContent =
  job.project || "-";



  currentJob = job;
  projektId =
    job.project_id || null;

  document.getElementById("statusSelect").value =
    job.status || (job.done ? "erledigt" : "offen");

  if (job.assigned_to) {
    document.getElementById("employeeSelect").value = job.assigned_to;
  }

  initProjectDocuments();

  document.getElementById(
    "customer"
  ).textContent =
    job.customer || "-";

  document.getElementById(
    "beschreibung"
  ).textContent =
    job.beschreibung || "-";

  document.getElementById(
    "faelligkeit"
  ).textContent =

  job.faelligkeit
  ? new Date(
      job.faelligkeit
    ).toLocaleDateString(
      "de-DE"
    )
  : "-";

  document.getElementById(
    "erledigtAm"
  ).textContent =
    job.erledigt_am
    ? new Date(
        job.erledigt_am
      ).toLocaleDateString(
        "de-DE"
      )
    : "-";

  await loadImages();
  await loadAudio();
  await loadVoiceNotes();
  await loadMaterialList();
}

async function loadEmployees() {
  const select = document.getElementById("employeeSelect");
  select.innerHTML = "<option value=''>Nicht zugewiesen</option>";

  if (!navigator.onLine) return;

  const { data, error } =
    await db
      .from("employees")
      .select("*")
      .order("name", { ascending: true });

  if (error) {
    console.log(error);
    return;
  }

  employees = data || [];

  employees.forEach(employee => {
    const option = document.createElement("option");
    option.value = employee.id;
    option.textContent = employee.name || "Mitarbeiter";
    select.appendChild(option);
  });
}

async function saveJobMeta() {
  const status = document.getElementById("statusSelect").value;
  const assignedTo = document.getElementById("employeeSelect").value || null;
  const statusEl = document.getElementById("jobMetaStatus");

  const update = {
    status,
    assigned_to: assignedTo,
    done: status === "erledigt" || status === "abgerechnet"
  };

  if (status === "erledigt" || status === "abgerechnet") {
    update.erledigt_am = currentJob && currentJob.erledigt_am
      ? currentJob.erledigt_am
      : new Date().toISOString();
  }

  const { data, error } =
    await db
      .from("auftraege")
      .update(update)
      .eq("id", jobId)
      .select()
      .single();

  if (error) {
    console.log(error);
    statusEl.textContent = "Status konnte nicht gespeichert werden.";
    statusEl.style.color = "#ff6b3b";
    return;
  }

  currentJob = data;
  statusEl.textContent = "Status gespeichert.";
  statusEl.style.color = "#9be15d";
}

function initProjectDocuments(){

  if(
    !projektId ||
    !window.BaudokuDocuments
  ){
    return;
  }

  window.BaudokuDocuments.init({

    getProjectId: () => projektId,

    setStatus: (text, color="#aaa") => {

      const status =
        document.getElementById(
          "documentStatus"
        );

      if(!status) return;

      status.textContent =
        text || "";

      status.style.color =
        color;
    },

    onFolderChange: () => {
      loadImages();
    }
  });
}

async function finishJob(){

  const completedAt =
    new Date().toISOString();

  const { error } =
    await db
    .from("auftraege")
    .update({
      done:true,
      erledigt_am: completedAt
    })
    .eq("id", jobId);

  if(error){

    const { error:fallbackError } =
      await db
      .from("auftraege")
      .update({
        done:true
      })
      .eq("id", jobId);

    if(fallbackError){

      console.log(fallbackError);
      alert("Fehler");
      return;
    }
  }

  if(projektId){

    await db
      .from("projects")
      .update({
        erledigt_am: completedAt
      })
      .eq("id", projektId);
  }

  window.location.href =
    "auftraege.html";
}

async function deleteJob(){

  const confirmDelete =
    confirm(
      "Auftrag wirklich löschen?"
    );

  if(!confirmDelete) return;

  await db
    .from("auftrag_material")
    .delete()
    .eq("auftrag_id", jobId);

  const { error } =
    await db
    .from("auftraege")
    .delete()
    .eq("id", jobId);

  if(error){

    console.log(error);
    alert(error.message);
    return;
  }

  window.location.href =
    "auftraege.html";
}

function goBack(){

  window.history.back();
}

// LOAD IMAGES
// =======================
async function loadImages(){

  const imageList =
    document.getElementById(
      "imageList"
    );

  imageList.innerHTML = "";

  if(projektId){

    const { data, error } =
      await db
      .from("project_images")
      .select("*")
      .eq("project_id", projektId)
      .order("created_at", {
        ascending:false
      });

    if(error){

      console.log(error);
      return;
    }

    const visibleImages =
      (data || []).filter(img => {

      if(!window.BaudokuDocuments){
        return true;
      }

      return window.BaudokuDocuments
        .imageBelongsToFolder(
          projektId,
          img.image_url,
          window.BaudokuDocuments
            .getCurrentFolderId()
        );
    });

    const resolvedImages =
      window.BautrailStorageLinks
        ? await Promise.all(
            visibleImages.map(async img => ({
              img,
              url: await window.BautrailStorageLinks.resolveRowUrl(img, {
                urlField: "image_url",
                pathField: "storage_path",
                bucketField: "storage_bucket",
                defaultBucket: "bilder",
                expiresIn: 3600
              })
            }))
          )
        : visibleImages.map(img => ({ img, url: img.image_url }));

    resolvedImages.forEach(item => {

    const img = item.img;
    const resolvedUrl = item.url || img.image_url;
    const div =
      document.createElement("div");

    div.className =
      "image-card";

    div.innerHTML = `

      <img
        src="${resolvedUrl}"
      >

      <button
        class="delete-image"
        onclick="
          event.stopPropagation();
          deleteImage('${img.id}')
        "
      >
        ✕
      </button>

      ${
        window.BaudokuDocuments
        ? `
          <button
            class="document-action-btn"
            style="width:100%;margin-top:8px;"
            onclick="
              event.stopPropagation();
              moveImageToFolder('${img.image_url}')
            "
          >
            Verschieben
          </button>
        `
        : ""
      }

    `;

    imageList.appendChild(div);

  });

    return;
  }

  imageList.innerHTML =
    "<p class='empty-hint'>Bilder werden erst nach dem Speichern des Projekts abgelegt.</p>";
}

document
.getElementById("imageInput")

.addEventListener(
  "change",
  async function(){

  const files = this.files;

  if(projektId){

    for(let file of files){

      if(window.BautrailStorageQuota && window.BAUDOKU_AUTH_CONTEXT){
    const quota = await window.BaudokuStorageQuota.canUploadBytes(window.BAUDOKU_AUTH_CONTEXT, file.size || 0);
    if(!quota.allowed){
      alert("Speicherlimit erreicht. Bitte im Chef-Dashboard Speicher erweitern.");
      return;
    }
  }

  const fileName =
        [
          projektId,
          Date.now(),
          Math.random()
            .toString(36)
            .slice(2)
        ].join("_") + ".jpg";

      const { error:uploadError } =
        await db
        .storage
        .from("bilder")
        .upload(fileName, file);

      if(uploadError){

        console.log(uploadError);
        continue;
      }

      const { error:insertError } =
        await db
        .from("project_images")
        .insert([{
          project_id: projektId,
          image_url: fileName,
          storage_bucket: "bilder",
          storage_path: fileName,
          folder_id:
            window.BaudokuDocuments
            ? window.BaudokuDocuments.getCurrentFolderId()
            : null,
          file_size: Number(file.size || 0)
        }]);

      if(insertError){
        console.log(insertError);
        continue;
      }

      if(window.BaudokuDocuments){
        await window.BaudokuDocuments
          .assignImageToFolder(
            fileName,
            projektId,
            window.BaudokuDocuments
              .getCurrentFolderId()
          );
      }
    }

    this.value = "";
    loadImages();
    return;
  }

  alert("Bitte den Auftrag zuerst mit einem Projekt verknuepfen.");

});

async function deleteImage(index){

  if(projektId){

    await db
      .from("project_images")
      .delete()
      .eq("id", index);

    loadImages();
    return;
  }

  loadImages();
}

async function moveImageToFolder(imageUrl){

  if(
    !window.BaudokuDocuments ||
    !projektId
  ){
    return;
  }

  await window.BaudokuDocuments
    .moveImage(
      imageUrl,
      projektId
    );
}

let mediaRecorder;
let audioChunks = [];
let currentAudioId = null;
let currentAudioPath = null;
let currentVoiceNoteId = null;
let voiceRecognitionSession = null;

function escapeHtml(value){
  return String(value || "")
    .replace(/[&<>"']/g, char => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[char]));
}

function setVoiceStatus(text, ok){
  const status =
    document.getElementById("voiceStatus");

  if(!status) return;

  status.textContent =
    text || "";

  status.style.color =
    ok === false
      ? "#ff6b3d"
      : "#9be15d";
}

async function startRecording(){

  const transcript =
    document.getElementById(
      "voiceTranscript"
    );

  if(transcript){
    transcript.value = "";
  }

  if(window.BautrailVoiceNotes){
    voiceRecognitionSession =
      window.BautrailVoiceNotes
        .startSpeechToText({
          onText:text => {
            const field =
              document.getElementById(
                "voiceTranscript"
              );
            if(field) field.value = text;
          },
          onStatus:text => setVoiceStatus(text, true)
        });
  }

  const stream =
    await navigator
    .mediaDevices
    .getUserMedia({
      audio:true
    });

  mediaRecorder =
    new MediaRecorder(stream);

  audioChunks = [];

  mediaRecorder.ondataavailable =
    e => {

    audioChunks.push(e.data);
  };

  mediaRecorder.onstop = async () => {

    const audioBlob =
      new Blob(audioChunks,{
        type:"audio/webm"
      });

    const audioUrl =
      URL.createObjectURL(audioBlob);

    const player =
      document.getElementById(
        "audioPlayer"
      );

    player.src = audioUrl;

    player.style.display =
      "block";

    document.getElementById(
      "deleteAudioBtn"
    ).style.display = "block";

    // 💾 speichern
    await saveAudioBlob(audioBlob);
  };

  mediaRecorder.start();
}

function stopRecording(){

  if(voiceRecognitionSession){
    voiceRecognitionSession.stop();
    voiceRecognitionSession = null;
  }

  if(mediaRecorder){

    mediaRecorder.stop();
  }
}

async function saveAudioBlob(audioBlob){

  if(!projektId){
    alert("Bitte den Auftrag zuerst mit einem Projekt verknuepfen.");
    return;
  }

  if(window.BautrailStorageQuota && window.BAUDOKU_AUTH_CONTEXT){
    const quota = await window.BaudokuStorageQuota.canUploadBytes(window.BAUDOKU_AUTH_CONTEXT, audioBlob.size || 0);
    if(!quota.allowed){
      alert("Speicherlimit erreicht. Bitte im Chef-Dashboard Speicher erweitern.");
      return;
    }
  }

  const fileName =
    [
      "audio",
      projektId,
      jobId + "_" + Date.now() + ".webm"
    ].join("/");

  const { error:uploadError } =
    await db
    .storage
    .from("bilder")
    .upload(fileName, audioBlob, {
      contentType:"audio/webm",
      upsert:true
    });

  if(uploadError){
    console.log(uploadError);
    alert("Sprachaufnahme konnte nicht hochgeladen werden.");
    return;
  }

  const { data:record, error:insertError } =
    await db
    .from("project_audio")
    .insert([{
      project_id: projektId,
      audio_url: fileName,
      storage_bucket: "bilder",
      storage_path: fileName,
      file_size: Number(audioBlob.size || 0),
      folder_id:
        window.BaudokuDocuments
        ? window.BaudokuDocuments.getCurrentFolderId()
        : null
    }])
    .select()
    .single();

  if(insertError){
    console.log(insertError);
    alert("Sprachaufnahme konnte nicht in Supabase gespeichert werden.");
    return;
  }

  currentAudioId =
    record && record.id
    ? record.id
    : null;

  currentAudioPath =
    fileName;

  await saveVoiceNoteForAudio(
    fileName,
    audioBlob
  );

  await loadVoiceNotes();
  setVoiceStatus("Sprachaufnahme gespeichert.", true);
}

async function saveVoiceNoteForAudio(fileName, audioBlob){

  if(!window.BautrailVoiceNotes){
    return;
  }

  const transcript =
    document.getElementById(
      "voiceTranscript"
    );

  const text =
    transcript
      ? transcript.value.trim()
      : "";

  const result =
    await window.BautrailVoiceNotes
      .saveVoiceNote({
        storage_path:fileName,
        audio_url:fileName,
        file_size:Number(audioBlob.size || 0),
        customer_id:
          currentJob
          ? currentJob.customer_id
          : null,
        project_id:projektId,
        auftrag_id:jobId,
        transcript:text,
        note_text:text,
        source:"auftrag-audio"
      });

  if(result.error){
    console.log(result.error);
    setVoiceStatus(
      "Audio gespeichert, Textnotiz konnte nicht gespeichert werden.",
      false
    );
    return;
  }

  currentVoiceNoteId =
    result.data && result.data.id
      ? result.data.id
      : null;
}

async function deleteAudio(){

  if(currentAudioId){
    const { error } =
      await db
      .from("project_audio")
      .delete()
      .eq("id", currentAudioId);

    if(error){
      console.log(error);
      alert("Sprachaufnahme konnte nicht gelöscht werden.");
      return;
    }
  }

  if(currentAudioPath){
    await db
      .from("voice_notes")
      .delete()
      .eq("storage_path", currentAudioPath);
  } else if(currentVoiceNoteId){
    await db
      .from("voice_notes")
      .delete()
      .eq("id", currentVoiceNoteId);
  }

  currentAudioId = null;
  currentAudioPath = null;
  currentVoiceNoteId = null;

  const player =
    document.getElementById(
      "audioPlayer"
    );

  player.src = "";

  player.style.display =
    "none";

  document.getElementById(
    "deleteAudioBtn"
  ).style.display = "none";

  const transcript =
    document.getElementById(
      "voiceTranscript"
    );

  if(transcript){
    transcript.value = "";
  }

  await loadVoiceNotes();
}

// =======================
// AUDIO LADEN
// =======================
async function loadAudio(){

  if(!projektId){
    return;
  }

  const { data, error } =
    await db
    .from("project_audio")
    .select("*")
    .eq("project_id", projektId)
    .order("created_at", {
      ascending:false
    })
    .limit(1);

  if(error){
    console.log(error);
    return;
  }

  const audio =
    data && data.length
    ? data[0]
    : null;

  if(!audio) return;

  currentAudioId =
    audio.id || null;

  currentAudioPath =
    audio.storage_path ||
    audio.audio_url ||
    null;

  const player =
    document.getElementById(
      "audioPlayer"
    );

  player.src =
    window.BautrailStorageLinks
      ? await window.BautrailStorageLinks.resolveRowUrl(audio, {
          urlField: "audio_url",
          pathField: "storage_path",
          bucketField: "storage_bucket",
          defaultBucket: "bilder",
          expiresIn: 3600
        })
      : audio.audio_url;

  player.style.display =
    "block";

  document.getElementById(
    "deleteAudioBtn"
  ).style.display = "block";

  await loadVoiceNotes();
}

async function loadVoiceNotes(){

  const list =
    document.getElementById(
      "voiceNoteList"
    );

  if(!list || !window.BautrailVoiceNotes){
    return;
  }

  const notes =
    await window.BautrailVoiceNotes
      .loadVoiceNotes({
        auftrag_id:jobId,
        limit:10
      });

  if(!notes.length){
    list.innerHTML =
      "<p style='opacity:0.7;'>Noch keine Textnotizen aus Sprache.</p>";
    return;
  }

  currentVoiceNoteId =
    notes[0].id || null;

  list.innerHTML = "";

  for(const note of notes){
    const url =
      await window.BautrailVoiceNotes
        .resolveAudioUrl(note);

    const div =
      document.createElement("div");

    div.className = "info-box";
    div.style.marginBottom = "8px";
    div.innerHTML = `
      <small>${new Date(note.created_at).toLocaleString("de-DE")}</small>
      <div class="text">${escapeHtml(note.note_text || note.transcript || "Ohne Text")}</div>
      ${
        url
        ? `<audio controls style="width:100%;margin-top:8px;" src="${url}"></audio>`
        : ""
      }
    `;

    list.appendChild(div);
  }
}

async function addMaterialItem(){

  const input =
    document.getElementById(
      "materialInput"
    );

  const value =
    input.value.trim();

  if(!value) return;

  const { error } =
    await db
    .from("auftrag_material")
    .insert({

      auftrag_id: jobId,

      text:value,

      done:false
    });

  if(error){

    console.log(error);
    return;
  }

  input.value = "";

  await loadMaterialList();
}

async function loadMaterialList(){

  const list =
    document.getElementById(
      "materialList"
    );

  list.innerHTML = "";

  const { data: items, error } =
    await db
    .from("auftrag_material")
    .select("*")
    .eq("auftrag_id", jobId)
    .order(
      "created_at",
      { ascending:false }
    );

  if(error){

    console.log(error);
    return;
  }

  items.forEach((item,index) => {

    const div =
      document.createElement("div");

    div.className =
      "material-item";

    div.innerHTML = `

      <div class="material-left">

        <input
          type="checkbox"
          class="material-check"
          ${item.done ? "checked" : ""}
          onchange="
            toggleMaterial('${item.id}')
          "
        >

        <span class="
          ${
            item.done
            ? "material-done"
            : ""
          }
        ">
          ${item.text}
        </span>

      </div>

      <button
        class="delete-btn"
        style="
          width:40px;
          height:40px;
          padding:0;
        "
        onclick="
          deleteMaterial('${item.id}')
        "
      >
        ✕
      </button>

    `;

    list.appendChild(div);

  });

  await updateProjectMaterialSummary(items);
}

async function updateProjectMaterialSummary(items){

  if(!projektId) return;

  const text =
    (items || [])
    .map(item =>
      (item.done ? "[x] " : "[ ] ") +
      item.text
    )
    .join("\n");

  await db
    .from("projects")
    .update({
      material:text
    })
    .eq("id", projektId);
}

async function toggleMaterial(id){

  const { data } =
    await db
    .from("auftrag_material")
    .select("done")
    .eq("id", id)
    .single();

  await db
    .from("auftrag_material")
    .update({
      done: !data.done
    })
    .eq("id", id);

  await loadMaterialList();
}

async function deleteMaterial(id){

  await db
    .from("auftrag_material")
    .delete()
    .eq("id", id);

  await loadMaterialList();
}
