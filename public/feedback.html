<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback - bautrail</title>
  <link rel="stylesheet" href="style.css?v=20260524a">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#ff6b3d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="bautrail">
  <link rel="icon" href="assets/bautrail-icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/bautrail-apple-touch-icon.png">
  <style>
    .feedback-mail-card {
      display: grid;
      gap: 10px;
    }

    .feedback-mail-card h3 {
      color: #fff;
      font-size: 1.15rem;
      line-height: 1.2;
    }

    .feedback-mail-card p {
      color: #bbb;
      font-size: 0.85rem;
      line-height: 1.35;
    }

    .feedback-mail-card label {
      display: grid;
      gap: 6px;
      color: #ddd;
      font-size: 0.82rem;
      font-weight: 800;
    }

    .feedback-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 4px;
    }

    .feedback-secondary-btn {
      width: 100%;
      min-height: 48px;
      border: none;
      border-radius: 14px;
      background: #444;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .feedback-recipient {
      padding: 10px 12px;
      border-radius: 12px;
      background: #202020;
      color: #ddd;
      font-size: 0.84rem;
      line-height: 1.35;
    }

    @media (max-width: 420px) {
      .feedback-actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
<div class="app-wrapper">
  <div class="app-content">
    <header class="app-header">
      <button class="back-btn" onclick="window.location.href='index.html'">&#8592;</button>
      <h1 class="app-name">&#128172; Feedback</h1>
      <p class="company-name">Ideen, Fehler und Wünsche direkt an bautrail senden</p>
    </header>

    <div class="task-card feedback-mail-card">
      <h3>Feedback an bautrail</h3>
      <p>Deine Rückmeldung wird als E-Mail vorbereitet und an bautrail geschickt.</p>

      <div class="feedback-recipient">
        Empfänger: <strong>bautrailapp@gmail.com</strong>
      </div>

      <label>Art
        <select id="feedbackType" class="compact-input">
          <option value="Idee">Idee</option>
          <option value="Fehler">Fehler</option>
          <option value="Verbesserung">Verbesserung</option>
          <option value="Frage">Frage</option>
        </select>
      </label>

      <label>Kurzer Titel
        <input id="feedbackTitle" class="compact-input" placeholder="z. B. Stundenzettel schneller ausfüllen">
      </label>

      <label>Beschreibung
        <textarea id="feedbackBody" class="compact-input compact-textarea" placeholder="Was ist dir aufgefallen oder was wünschst du dir?"></textarea>
      </label>

      <label>Kontakt für Rückfragen
        <input id="feedbackContact" class="compact-input" placeholder="E-Mail oder Name">
      </label>

      <div class="feedback-actions">
        <button class="login-btn" type="button" onclick="sendFeedbackMail()">Per E-Mail senden</button>
        <button class="feedback-secondary-btn" type="button" onclick="copyFeedbackMail()">Text kopieren</button>
      </div>

      <p id="feedbackStatus" style="min-height:18px;">&nbsp;</p>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html"><span>&#127968;</span><small>&Uuml;bersicht</small></a>
    <a href="kunden.html"><span>&#128101;</span><small>Kunden</small></a>
    <a href="zeiten.html"><span>&#9201;&#65039;</span><small>Zeiten</small></a>
    <a href="profil.html" class="active"><span>&#9881;&#65039;</span><small>Einstellungen</small></a>
  </nav>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="auth-context.js"></script>
<script src="role-nav.js"></script>
<script>
const FEEDBACK_MAIL = "bautrailapp@gmail.com";
let authContext = null;

function fieldValue(id) {
  const el = document.getElementById(id);
  return el ? el.value.trim() : "";
}

function setStatus(text, ok) {
  const el = document.getElementById("feedbackStatus");
  if (!el) return;
  el.textContent = text || "\u00A0";
  el.style.color = ok ? "#6bd86b" : "#ff6b3d";
}

function feedbackPayload() {
  const type = fieldValue("feedbackType") || "Feedback";
  const title = fieldValue("feedbackTitle");
  const body = fieldValue("feedbackBody");
  const contact = fieldValue("feedbackContact");

  return { type, title, body, contact };
}

function validateFeedback(payload) {
  if (!payload.title || !payload.body) {
    setStatus("Bitte Titel und Beschreibung eintragen.", false);
    return false;
  }
  return true;
}

function buildFeedbackMail(payload) {
  const ctx = authContext || {};
  const lines = [
    "Feedback aus der bautrail App",
    "",
    "Art: " + payload.type,
    "Titel: " + payload.title,
    "",
    "Beschreibung:",
    payload.body,
    "",
    "Kontakt für Rückfragen: " + (payload.contact || ctx.email || "-"),
    "Benutzer: " + (ctx.name || "-"),
    "Benutzer-Mail: " + (ctx.email || "-"),
    "Rolle: " + (ctx.role || "-"),
    "Firma-ID: " + (ctx.company_id || "-"),
    "",
    "Technik:",
    "Zeitpunkt: " + new Date().toLocaleString("de-DE"),
    "Seite: " + window.location.href,
    "Browser: " + navigator.userAgent
  ];

  return {
    subject: "bautrail Feedback: " + payload.type + " - " + payload.title,
    body: lines.join("\n")
  };
}

function mailtoUrl(mail) {
  return "mailto:" + FEEDBACK_MAIL +
    "?subject=" + encodeURIComponent(mail.subject) +
    "&body=" + encodeURIComponent(mail.body);
}

function clearFeedbackForm() {
  ["feedbackTitle", "feedbackBody"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = "";
  });
}

function sendFeedbackMail() {
  const payload = feedbackPayload();
  if (!validateFeedback(payload)) return;

  const mail = buildFeedbackMail(payload);
  const url = mailtoUrl(mail);

  if (url.length > 1900) {
    copyFeedbackMail();
    window.location.href = "mailto:" + FEEDBACK_MAIL + "?subject=" + encodeURIComponent(mail.subject);
    setStatus("Der Text war sehr lang. Ich habe ihn kopiert und die E-Mail geöffnet.", true);
    return;
  }

  window.location.href = url;
  clearFeedbackForm();
  setStatus("E-Mail wurde vorbereitet. Bitte im Mailprogramm noch auf Senden tippen.", true);
}

async function copyFeedbackMail() {
  const payload = feedbackPayload();
  if (!validateFeedback(payload)) return;

  const mail = buildFeedbackMail(payload);
  const text = "An: " + FEEDBACK_MAIL + "\nBetreff: " + mail.subject + "\n\n" + mail.body;

  try {
    await navigator.clipboard.writeText(text);
    setStatus("Feedback-Text kopiert.", true);
  } catch (error) {
    console.log(error);
    setStatus("Kopieren hat nicht geklappt. Bitte E-Mail senden nutzen.", false);
  }
}

(async function() {
  if (!window.BaudokuAuthContext) return;
  authContext = await window.BaudokuAuthContext.loadAuthContext({ noCache: true });

  const contact = document.getElementById("feedbackContact");
  if (contact && authContext && authContext.email) {
    contact.value = authContext.email;
  }
})();
</script>
<script src="pwa.js"></script>
</body>
</html>
