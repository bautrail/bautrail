<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Büro Dashboard - bautrail</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#ff6b3d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="bautrail">
  <link rel="icon" href="assets/bautrail-icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/bautrail-apple-touch-icon.png">
</head>
<body>
<div class="app-wrapper">
  <div class="app-content">
    <header class="app-header">
      <h1 class="app-name">Büro Dashboard</h1>
      <p class="company-name">Verwaltung</p>
    </header>

    <div class="task-card">
      <h3>Willkommen</h3>
      <p id="roleInfo" style="opacity:0.8;">Lade Daten...</p>
      <button class="login-btn" onclick="window.location.href='index.html'">Zur Übersicht</button>
    </div>
    <div class="task-card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
        <h3>Wiederkehrende Auftraege</h3>
        <button class="login-btn" style="width:auto;margin:0;padding:10px 12px;background:#444;" onclick="window.location.href='wiederkehrende-auftraege.html'">Oeffnen</button>
      </div>
      <div id="recurringDashboardList" style="margin-top:10px;"></div>
    </div>
  </div>
</div>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="auth-context.js"></script>
<script src="notifications.js"></script>
<script src="recurring-orders.js"></script>
<script>
let authContext = null;

function escapeHtml(value) {
  return String(value || "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[char]));
}

async function loadRecurringDashboard() {
  const target = document.getElementById("recurringDashboardList");
  if (!target || !authContext || !authContext.company_id || !window.BautrailRecurringOrders) return;

  target.innerHTML = "<p style='opacity:0.7;'>Lade Wiederholungen...</p>";
  await window.BautrailRecurringOrders.processDueRecurrences();
  const reminders = await window.BautrailRecurringOrders.loadOpenReminders(6);

  if (!reminders.length) {
    target.innerHTML = "<p style='opacity:0.7;'>Keine offenen Erinnerungen.</p>";
    return;
  }

  target.innerHTML = reminders.map(reminder => `
    <div class="info-box" style="margin-top:0;margin-bottom:8px;min-height:0;">
      <small>${escapeHtml(reminder.status)} | faellig ${window.BautrailRecurringOrders.formatDateDe(reminder.due_date)}</small>
      <div class="text">${escapeHtml(reminder.title)}</div>
      <small>${escapeHtml(reminder.message || "")}</small>
    </div>
  `).join("");
}

(async function() {
  const ctx = await window.BaudokuAuthContext.loadAuthContext();
  authContext = ctx;
  if (!ctx) {
    window.location.href = "login.html";
    return;
  }
  if (!window.BaudokuAuthContext.requireRole(ctx, ["buero", "chef"])) {
    window.location.href = window.BaudokuAuthContext.dashboardPathForRole(ctx.role);
    return;
  }
  document.getElementById("roleInfo").textContent =
    "Angemeldet als " + (ctx.name || ctx.email || "Büro") + ".";
  await loadRecurringDashboard();
})();
</script>
<script src="pwa.js"></script>
</body>
</html>
