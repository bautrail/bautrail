<script>

// =====================================================
// GLOBAL
// =====================================================
let projektId;
let currentProject = null;

let currentImages = [];
let currentImageEntries = [];
let currentIndex = 0;
let saveTimeout;


// =====================================================
// QUEUES
// =====================================================
function getCreateQueue() {
  return JSON.parse(localStorage.getItem("createQueue")) || [];
}

function saveCreateQueue(q) {
  localStorage.setItem("createQueue", JSON.stringify(q));
}

function getUpdateQueue() {
  return JSON.parse(localStorage.getItem("updateQueue")) || [];
}

function saveUpdateQueue(q) {
  localStorage.setItem("updateQueue", JSON.stringify(q));
}

function getDeleteQueue() {
  return JSON.parse(localStorage.getItem("deleteQueue")) || [];
}

function saveDeleteQueue(q) {
  localStorage.setItem("deleteQueue", JSON.stringify(q));
}

function getOfflineUploads() {
  return JSON.parse(localStorage.getItem("offlineUploads")) || [];
}

function saveOfflineUploads(q) {
  localStorage.setItem("offlineUploads", JSON.stringify(q));
}

function getPendingUpdateValue(id, field) {
  const item =
    getUpdateQueue()
      .slice()
      .reverse()
      .find(q =>
        String(q.id) === String(id) &&
        q.field === field
      );

  return item ? item.value : undefined;
}

function getPendingUploadsForProject(id) {
  return getOfflineUploads().filter(img =>
    String(img.project_id) === String(id)
  );
}

function getCurrentFolderId() {
  if (!window.BaudokuDocuments) return null;

  return window.BaudokuDocuments.getCurrentFolderId();
}

function makeOfflineImageId() {
  return [
    "image",
    Date.now(),
    Math.random().toString(36).slice(2)
  ].join("_");
}

function getOfflineImageKey(item) {
  return item.id || item.image;
}

function imageIsInCurrentFolder(key, fallbackFolderId) {
  const folderId =
    getCurrentFolderId();

  if (fallbackFolderId !== undefined) {
    const imageFolder =
      fallbackFolderId || null;

    const currentFolder =
      folderId || null;

    return String(imageFolder) === String(currentFolder);
  }

  if (!window.BaudokuDocuments) {
    return !folderId;
  }

  return window.BaudokuDocuments.imageBelongsToFolder(
    projektId,
    key,
    folderId
  );
}

function makeImageFileName(projectId) {
  return [
    projectId,
    Date.now(),
    Math.random().toString(36).slice(2)
  ].join("_") + ".jpg";
}

function dataURLtoBlob(dataurl) {
  const arr =
    dataurl.split(",");

  const mime =
    arr[0]
      .match(/:(.*?);/)[1];

  const bstr =
    atob(arr[1]);

  let n =
    bstr.length;

  const u8arr =
    new Uint8Array(n);

  while(n--) {
    u8arr[n] =
      bstr.charCodeAt(n);
  }

  return new Blob(
    [u8arr],
    { type:mime }
  );
}


// =====================================================
// START
// =====================================================
document.addEventListener("DOMContentLoaded", function() {

  projektId =
    new URLSearchParams(window.location.search)
    .get("id");

  const textarea =
    document.getElementById("beschreibung");

  const status =
    document.getElementById("saveStatus");

  const offlineStatus =
    document.getElementById("offlineStatus");

  const documentStatus =
    document.getElementById("documentStatus");


  // =====================================================
  // STATUS
  // =====================================================
  function setOfflineStatus(text, color="#aaa") {

    offlineStatus.textContent = text;
    offlineStatus.style.color = color;
  }

  function updateConnectionStatus() {

    if (!navigator.onLine) {
      setOfflineStatus("Offline - Aenderungen werden synchronisiert", "orange");
      if (documentStatus) {
        documentStatus.textContent = "Offline - Uploads werden später übertragen";
        documentStatus.style.color = "orange";
      }
      return;
    }

    setOfflineStatus("Online - Daten bereits hochgeladen", "#9be15d");
    if (documentStatus) {
      documentStatus.textContent = "Online - neue Dateien werden direkt hochgeladen";
      documentStatus.style.color = "#9be15d";
    }
  }

  if (window.BaudokuDocuments) {

    window.BaudokuDocuments.init({
      getProjectId: () => projektId,
      setStatus: (text, color="#aaa") => {
        setOfflineStatus(text, color);

        if (documentStatus) {
          documentStatus.textContent = text;
          documentStatus.style.color = color;
        }
      },
      onFolderChange: () => loadImages()
    });
  }

  updateConnectionStatus();
  window.addEventListener("online", updateConnectionStatus);
  window.addEventListener("offline", updateConnectionStatus);


  // =====================================================
  // LOAD PROJEKT
  // =====================================================
  async function loadProjekt() {

    // OFFLINE
    if (!navigator.onLine) {

      const cached =
        JSON.parse(
          localStorage.getItem(
            "project_" + projektId
          )
        );

      if (cached) {

        const pendingDescription =
          getPendingUpdateValue(
            projektId,
            "beschreibung"
          );

        if (pendingDescription !== undefined) {
          cached.beschreibung =
            pendingDescription;
        }

        document.getElementById("projektName").textContent =
          cached.name || "";

        document.getElementById("projektInfo").textContent =
          (cached.ort || "") + " " + (cached.datum || "");

        textarea.value =
          cached.beschreibung || "";

        currentProject = cached;
        fillProjectEditForm(cached);
      }

      loadImages();

      if (window.BaudokuDocuments) {
        await window.BaudokuDocuments.load();
      }

      return;
    }

    // ONLINE
    const { data, error } = await db
  .from("projects")
  .select("*")
  .eq("id", projektId)
  .single();

if (error || !data) {

  // fallback cache
  const cached =
    JSON.parse(
      localStorage.getItem(
        "project_" + projektId
      )
    );

  if (cached) {

    const pendingDescription =
      getPendingUpdateValue(
        projektId,
        "beschreibung"
      );

    if (pendingDescription !== undefined) {
      cached.beschreibung =
        pendingDescription;
    }

    document.getElementById("projektName").textContent =
      cached.name || "";

    document.getElementById("projektInfo").textContent =
      (cached.ort || "") +
      " " +
      (cached.datum || "");

    textarea.value =
      cached.beschreibung || "";

    currentProject = cached;
    fillProjectEditForm(cached);
  }

  if (window.BaudokuDocuments) {
    await window.BaudokuDocuments.load();
  }

  return;
}

const visibleProject = {
  ...data
};

currentProject = visibleProject;

const pendingDescription =
  getPendingUpdateValue(
    projektId,
    "beschreibung"
  );

if (pendingDescription !== undefined) {
  visibleProject.beschreibung =
    pendingDescription;
}

// ===== CACHE =====
localStorage.setItem(
  "project_" + projektId,
  JSON.stringify(visibleProject)
);

document.getElementById("projektName").textContent =
  visibleProject.name || "";


 const info =
   document.getElementById("projektInfo");

 if (data.customer) {

   info.style.display = "block";

   info.innerHTML = `
     <div class="info-box">
       <small>Kunde</small>
       <div class="text">
         ${data.customer}
       </div>
     </div>
   `;

 } else {

   info.style.display = "none";
 }

textarea.value =
  visibleProject.beschreibung || "";

fillProjectEditForm(visibleProject);

if (window.BaudokuAutoTextareas) {
  window.BaudokuAutoTextareas.init();
}

    loadImages();
    loadProjectReports();
    loadAuditHistory();

    if (window.BaudokuDocuments) {
      await window.BaudokuDocuments.load();
    }
  }

  function fillProjectEditForm(project) {
    document.getElementById("editProjectNumber").value =
      project.project_number || "";

    document.getElementById("editProjectName").value =
      project.name || "";

    document.getElementById("editProjectOrt").value =
      project.ort || "";

    document.getElementById("editProjectDatum").value =
      project.datum || "";

    document.getElementById("editProjectFaelligkeit").value =
      project.faelligkeit || "";

    document.getElementById("editProjectStatus").value =
      project.status || "offen";

    document.getElementById("editProjectMaterial").value =
      project.material || "";
  }

  async function loadProjectReports() {

    const list =
      document.getElementById("reportListProject");

    if (!list || !projektId) return;

    if (!navigator.onLine) {
      list.innerHTML =
        "<p style='opacity:0.7;'>Stundennachweise werden online geladen.</p>";
      return;
    }

    const { data, error } =
      await db
        .from("stundennachweise")
        .select("*")
        .eq("project_id", projektId)
        .order("created_at", { ascending: false })
        .limit(6);

    if (error) {
      console.log(error);
      list.innerHTML =
        "<p style='opacity:0.7;'>Stundennachweise konnten nicht geladen werden.</p>";
      return;
    }

    if (!(data || []).length) {
      list.innerHTML =
        "<p style='opacity:0.7;'>Noch keine Stundennachweise vorhanden.</p>";
      return;
    }

    list.innerHTML =
      (data || []).map(item => `
        <div class="info-box" style="margin-top:0;margin-bottom:8px;min-height:0;">
          <small>${item.arbeitsdatum || "-"}</small>
          <div class="text">${item.objekt || "Objekt"} - ${item.customer || ""}</div>
          <small>${item.stunden || 0} Std. | ${item.unterschrift_name || "ohne Name"}</small>
        </div>
      `).join("");
  }

  async function loadAuditHistory() {
    const list =
      document.getElementById("auditListProject");

    if (!list || !projektId) return;

    if (!navigator.onLine) {
      list.innerHTML =
        "<p style='opacity:0.7;'>Verlauf wird online geladen.</p>";
      return;
    }

    const { data, error } =
      await db
        .from("audit_log")
        .select("*")
        .eq("table_name", "projects")
        .eq("row_id", String(projektId))
        .order("created_at", { ascending: false })
        .limit(12);

    if (error) {
      console.log(error);
      list.innerHTML =
        "<p style='opacity:0.7;'>Verlauf aktuell nicht verfügbar.</p>";
      return;
    }

    if (!(data || []).length) {
      list.innerHTML =
        "<p style='opacity:0.7;'>Noch keine Aenderungen vorhanden.</p>";
      return;
    }

    list.innerHTML =
      (data || []).map(item => `
        <div class="info-box" style="margin-top:0;margin-bottom:8px;min-height:0;">
          <small>${new Date(item.created_at).toLocaleString("de-DE")}</small>
          <div class="text">${item.action || "update"}</div>
        </div>
      `).join("");
  }

  function openProjectReportCreate() {

    const params = new URLSearchParams();

    if (currentProject && currentProject.customer_id) {
      params.set("customer_id", currentProject.customer_id);
    }

    if (projektId) {
      params.set("project_id", projektId);
    }

    window.location.href =
      "stunden-nachweis.html?" + params.toString();
  }

  window.saveProjectDetails = async function() {

    const status =
      document.getElementById(
        "projectSaveStatus"
      );

    const payload = {
      name: document.getElementById("editProjectName").value.trim(),
      ort: document.getElementById("editProjectOrt").value.trim(),
      datum: document.getElementById("editProjectDatum").value.trim(),
      faelligkeit: document.getElementById("editProjectFaelligkeit").value || null,
      status: document.getElementById("editProjectStatus").value || "offen",
      material: document.getElementById("editProjectMaterial").value.trim()
    };

    if (!payload.name) {
      status.textContent = "Projektname fehlt.";
      status.style.color = "#ff3b3b";
      return;
    }

    const { data, error } =
      await db
      .from("projects")
      .update(payload)
      .eq("id", projektId)
      .select()
      .single();

    if (error) {
      console.log(error);
      status.textContent =
        "Projekt konnte nicht gespeichert werden.";
      status.style.color = "#ff3b3b";
      return;
    }

    currentProject = data;

    localStorage.setItem(
      "project_" + projektId,
      JSON.stringify(data)
    );

    document.getElementById("projektName").textContent =
      data.name || "";

    status.textContent = "Projekt gespeichert.";
    status.style.color = "#4caf50";

    await loadProjekt();
  };

  function safeZipName(name) {
    return String(name || "datei")
      .replace(/[\\/:*?"<>|]+/g, "_")
      .trim() || "datei";
  }

  function folderPathFor(folderId, folders) {
    const parts = [];
    let active =
      folders.find(folder =>
        String(folder.id) === String(folderId)
      );

    while (active) {
      parts.unshift(safeZipName(active.name));
      active =
        folders.find(folder =>
          String(folder.id) === String(active.parent_id)
        );
    }

    return parts.join("/");
  }

  window.downloadProjectZip = async function() {

    if (!window.JSZip) {
      alert("Download-Modul konnte nicht geladen werden.");
      return;
    }

    const zip =
      new JSZip();

    const project =
      currentProject || {};

    const folderRoot =
      safeZipName(project.name || "Projekt");

    zip.file(
      folderRoot + "/projekt.json",
      JSON.stringify(project, null, 2)
    );

    const exportData =
      window.BaudokuDocuments &&
      window.BaudokuDocuments.getProjectExportData
        ? await window.BaudokuDocuments
            .getProjectExportData(projektId)
        : {
            folders: [],
            documents: [],
            imageFolders: []
          };

    for (let folder of exportData.folders) {
      const folderPath =
        folderPathFor(
          folder.id,
          exportData.folders
        );

      zip.folder(
        folderRoot + "/" + folderPath
      );
    }

    for (let file of exportData.documents) {
      let blob = file.blob;

      if (!blob && file.public_url) {
        try {
          blob =
            await fetch(file.public_url)
            .then(response => response.blob());
        } catch (err) {
          console.log(err);
        }
      }

      if (!blob) continue;

      const folderPath =
        folderPathFor(
          file.folder_id,
          exportData.folders
        );

      const path =
        [
          folderRoot,
          folderPath,
          safeZipName(file.name)
        ]
        .filter(Boolean)
        .join("/");

      zip.file(path, blob);
    }

    const { data:images } =
      await db
      .from("project_images")
      .select("*")
      .eq("project_id", projektId);

    let imageIndex = 1;

    for (let image of images || []) {
      try {
        const blob =
          await fetch(image.image_url)
          .then(response => response.blob());

        const imageFolder =
          exportData.imageFolders
          .find(item =>
            item.image_key === image.image_url
          );

        const folderPath =
          folderPathFor(
            imageFolder && imageFolder.folder_id,
            exportData.folders
          );

        const path =
          [
            folderRoot,
            folderPath,
            "bild_" + imageIndex + ".jpg"
          ]
          .filter(Boolean)
          .join("/");

        zip.file(path, blob);
        imageIndex++;
      } catch (err) {
        console.log(err);
      }
    }

    const blob =
      await zip.generateAsync({
        type: "blob"
      });

    const url =
      URL.createObjectURL(blob);

    const link =
      document.createElement("a");

    link.href = url;
    link.download =
      folderRoot + ".zip";

    link.click();

    setTimeout(() => {
      URL.revokeObjectURL(url);
    }, 1000);
  };

  function blobToDataUrl(blob) {
    return new Promise(resolve => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.readAsDataURL(blob);
    });
  }

  async function collectProjectImagesForPdf(limit) {

    const { data: images } =
      await db
        .from("project_images")
        .select("*")
        .eq("project_id", projektId)
        .order("created_at", { ascending: false })
        .limit(limit);

    const result = [];

    for (let image of images || []) {
      try {
        const blob =
          await fetch(image.image_url)
            .then(response => response.blob());

        result.push({
          url: image.image_url,
          dataUrl: await blobToDataUrl(blob)
        });
      } catch (err) {
        console.log(err);
      }
    }

    return result;
  }

  window.downloadProjectPdf = async function() {

    if (!window.jspdf || !window.jspdf.jsPDF) {
      alert("PDF-Modul konnte nicht geladen werden.");
      return;
    }

    const { jsPDF } =
      window.jspdf;

    const pdf =
      new jsPDF({
        unit: "mm",
        format: "a4"
      });

    const project =
      currentProject || {};

    const exportData =
      window.BaudokuDocuments &&
      window.BaudokuDocuments.getProjectExportData
        ? await window.BaudokuDocuments.getProjectExportData(projektId)
        : {
            documents: []
          };

    const images =
      await collectProjectImagesForPdf(4);

    let y = 18;

    function addLine(label, value) {
      if (!value) return;

      pdf.setFont("helvetica", "bold");
      pdf.text(label, 14, y);
      pdf.setFont("helvetica", "normal");

      const lines =
        pdf.splitTextToSize(String(value), 180);

      pdf.text(lines, 48, y);
      y += Math.max(8, lines.length * 6);
    }

    pdf.setFont("helvetica", "bold");
    pdf.setFontSize(18);
    pdf.text("bautrail Projektbericht", 14, y);
    y += 12;

    pdf.setFontSize(11);
    addLine("Kunde", project.customer || "-");
    addLine("Projekt", project.name || "-");
    addLine("Ort", project.ort || "-");
    addLine("Datum", project.datum || "-");
    addLine("Fälligkeit", project.faelligkeit || "-");
    addLine("Beschreibung", project.beschreibung || "-");
    addLine("Material", project.material || "-");

    if (exportData.documents && exportData.documents.length) {
      y += 4;
      pdf.setFont("helvetica", "bold");
      pdf.text("Dokumente", 14, y);
      y += 7;
      pdf.setFont("helvetica", "normal");

      exportData.documents.slice(0, 12).forEach(file => {
        const lines =
          pdf.splitTextToSize("- " + (file.name || "Dokument"), 180);
        pdf.text(lines, 18, y);
        y += lines.length * 6;
      });
    }

    if (images.length) {
      pdf.addPage();
      pdf.setFont("helvetica", "bold");
      pdf.setFontSize(16);
      pdf.text("Bilder", 14, 18);

      let imageY = 28;
      let imageX = 14;

      for (let index = 0; index < images.length; index++) {
        pdf.addImage(
          images[index].dataUrl,
          "JPEG",
          imageX,
          imageY,
          85,
          60
        );

        if (imageX > 14) {
          imageX = 14;
          imageY += 70;
        } else {
          imageX = 109;
        }
      }
    }

    pdf.save(
      safeZipName(project.name || "Projektbericht") + ".pdf"
    );
  };

const oldCache =

if (oldCache) {

}

          window.history.replaceState(
            {},
            "",
            "projekt-detail.html?id=" + newId
          );
        }

        // ===== PROJECT CACHE =====
        const cached =
          JSON.parse(
            localStorage.getItem(
              "project_" + p.id
            )
          );

        if (cached) {

          cached.id = newId;

          localStorage.setItem(
            "project_" + newId,
            JSON.stringify(cached)
          );

          localStorage.removeItem(
            "project_" + p.id
          );
        }

        // ===== UPDATE QUEUE =====
        let updates =
          getUpdateQueue();

        updates =
          updates.map(u => {

            if (
              String(u.id) ===
              String(p.id)
            ) {

              return {
                ...u,
                id: newId
              };
            }

            return u;

          getOfflineUploads();

          await window.BaudokuDocuments.migrateProjectId(

        remaining.push(p);
      }

    saveCreateQueue(remaining);

  // =====================================================
  // SYNC UPDATES
  // =====================================================
  async function syncUpdates() {

    if (!navigator.onLine) return;

    let queue =
      getUpdateQueue();

    if (!queue.length) return;

    const remaining = [];

    for (let item of queue) {

      try {

        const { data, error } =
          await db
          .from("projects")
          .update({
            [item.field]: item.value
          })
          .eq("id", item.id)
          .select("id")
          .maybeSingle();

        if (error || !data) {

          console.log(error);

          remaining.push(item);

          continue;
        }

        const cached =
          JSON.parse(
            localStorage.getItem(
              "project_" + item.id
            )
          ) || {};

        cached[item.field] =
          item.value;

        localStorage.setItem(
          "project_" + item.id,
          JSON.stringify(cached)
        );

      } catch(err) {

        console.log(err);

        remaining.push(item);
      }
    }

    saveUpdateQueue(remaining);
  }

      visiblePendingUploads.forEach(img =>
        appendImage(
          img.image,
          "Offline gespeichert",
          getOfflineImageKey(img)

      );

      return;
    }

    // ONLINE
    const { data } = await db
      .from("project_images")
      .select("*")
      .eq("project_id", projektId)
      .order("created_at", {
        ascending:false
      });

    if (!data && !pendingUploads.length) return;

    (data || [])

        imageIsInCurrentFolder(img.image_url)
      )
      .forEach(img =>
        appendImage(
          img.image_url,
          "",
          img.image_url
        )
      );

    pendingUploads
      .filter(img =>
        imageIsInCurrentFolder(
          getOfflineImageKey(img),
          img.folder_id
        )
      )
      .forEach(img =>
      appendImage(
        img.image,
        "Wird synchronisiert",
        getOfflineImageKey(img)
      )
    );
  }

  async function deleteProjectImage(imageKey, isOffline) {

    if (!imageKey) return;

    if (isOffline) {
      const remainingUploads =
        getOfflineUploads().filter(item =>
          String(getOfflineImageKey(item)) !== String(imageKey)
        );

      saveOfflineUploads(remainingUploads);
      closeImage({ stopPropagation() {} });
      await loadImages();
      return;
    }

    const { error } =
      await db
        .from("project_images")
        .delete()
        .eq("project_id", projektId)
        .eq("image_url", imageKey);

    if (error) {
      console.log(error);
      setOfflineStatus("Bild konnte nicht gelöscht werden", "red");
      return;
    }

    closeImage({ stopPropagation() {} });
    await loadImages();
  }

  function hasPendingChanges() {

    return (
      getCreateQueue().length > 0 ||
      getUpdateQueue().length > 0 ||
      getOfflineUploads().length > 0 ||
      (
        window.BaudokuDocuments &&
        window.BaudokuDocuments.hasPending()
      )
    );
  }

  async function syncPendingChanges() {

    if (!navigator.onLine) return;

    if (!hasPendingChanges()) {

      await loadProjekt();

      return;
    }

    setOfflineStatus(
      "Synchronisiere...",
      "#2196f3"
    );

    await syncCreatedProjects();

    await syncUpdates();

    await syncOfflineUploads();

    if (window.BaudokuDocuments) {
      await window.BaudokuDocuments.syncAll();
    }

    await loadProjekt();

    if (hasPendingChanges()) {

      setOfflineStatus(
        "Noch nicht alles synchronisiert",
        "orange"
      );

      return;
    }

    setOfflineStatus(
      "Synchronisiert",
      "#4caf50"
    );

    setTimeout(() => {

  window.openImage = function(url) {

    currentImageEntries =
      Array.from(
        document.querySelectorAll(
          "#imageList .image-card"
        )
      ).map(card => ({
        src: card.dataset.imageSrc,
        key: card.dataset.imageKey,
        offline: card.dataset.offline === "true"
      }));

    currentImages =
      currentImageEntries.map(item => item.src);

    currentIndex =
      currentImages.indexOf(url);

    showImage();
  };

  function showImage() {

    document.getElementById("overlayImg").src =
      currentImages[currentIndex];

    document.getElementById("imageOverlay").style.display =
      "flex";
  }

  window.closeImage = e => {

    e.stopPropagation();

    document.getElementById("imageOverlay").style.display = "none";
  };

  window.nextImage = e => {

    e.stopPropagation();

    currentIndex =
      (currentIndex + 1) %
      currentImages.length;

    showImage();
  };

  window.prevImage = e => {

    e.stopPropagation();

    currentIndex =
      (
        currentIndex - 1 +
        currentImages.length
      ) %
      currentImages.length;

    showImage();
  };

  window.deleteCurrentImage = async e => {

    e.stopPropagation();

    const currentEntry =
      currentImageEntries[currentIndex];

    if (!currentEntry) return;

    await deleteProjectImage(
      currentEntry.key,
      currentEntry.offline
    );
  };


  // =====================================================
  // INIT
  // =====================================================
  if (navigator.onLine) {

    syncPendingChanges();

  } else {

    loadProjekt();
  }

});
