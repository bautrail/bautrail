<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Auftrag erstellen - bautrail</title>

<link rel="stylesheet" href="style.css">

<style>

.input{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2b2b2b;
  color:white;
  margin-top:10px;
  box-sizing:border-box;
}

textarea{
  width:100%;
  height:140px;
  border:none;
  border-radius:12px;
  padding:14px;
  background:#2b2b2b;
  color:white;
  resize:none;
  margin-top:10px;
  box-sizing:border-box;
}

.save-btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#ff6b3d;
  color:white;
  font-size:16px;
  font-weight:bold;
  margin-top:14px;
  cursor:pointer;
}

.search-results{
  margin-top:10px;
}

.result-item{
  background:#1e1e1e;
  border-radius:12px;
  padding:12px;
  margin-bottom:8px;
  cursor:pointer;
  color:white !important;
}

.result-item strong{
  color:white !important;
}

.result-item div{
  color:white !important;
}

.result-item span{
  color:white !important;
}

.result-item,
.result-item *{
  color:white !important;
}



</style>

  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#ff6b3d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="bautrail">
  <link rel="icon" href="assets/bautrail-icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/bautrail-apple-touch-icon.png">
</head>
<body>

<div class="app-wrapper">

<div class="app-content">

<header class="app-header">

<button
class="back-btn"
onclick="goBack()"
>&#8592;</button>

<h1 class="app-name">
➕ Auftrag
</h1>

<p class="company-name">
Neue Kleinigkeit
</p>

</header>

<!-- KUNDE -->
<div class="task-card">

<h3>👥 Kunde</h3>

<input
type="text"
id="customerSearch"
class="input"
placeholder="Kunde suchen..."
oninput="searchCustomers()"
>

<div id="customerResults"
class="search-results"></div>

</div>

<!-- PROJEKT -->
<div class="task-card">

<h3>📦 Projekt</h3>

<input
type="text"
id="projectSearch"
class="input"
placeholder="Projekt suchen..."
oninput="searchProjects()"
disabled
>

<div id="projectResults"
class="search-results"></div>

</div>

<!-- MATERIAL -->
<div class="task-card" id="materialCard" style="display:none;">

<h3>🧱 Material</h3>

<textarea
id="material"
placeholder="Welches Material wird benötigt?"
></textarea>

<div
id="favoriteMaterialList"
style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;"
></div>

<button
class="save-btn"
style="background:#444;margin-top:10px;"
onclick="saveCurrentMaterialFavorite()"
>
Material als Favorit speichern
</button>

</div>

<!-- NOTIZ -->
<div class="task-card">

<h3>📝 Beschreibung</h3>


<select
  id="priority"
  class="input"
>

  <option value="normal">
    🟢 Normal
  </option>

  <option value="week">
    🟠 Diese Woche
  </option>

  <option value="urgent">
    🔴 Dringend
  </option>

</select>

<input
  type="date"
  id="faelligkeit"
  class="input"
>

<textarea
  id="beschreibung"
  class="input"
  placeholder="Beschreibung..."
></textarea>

<h3 style="margin-top:14px;">Vorlagen</h3>
<div id="templateList" class="search-results"></div>

<button
  class="save-btn"
  style="background:#444;"
  onclick="saveCurrentTemplate()"
>
  Aktuelle Eingabe als Vorlage speichern
</button>

</div>

<!-- WIEDERHOLUNG -->
<div class="task-card" id="recurringCard">

<h3>Wiederkehrender Auftrag</h3>

<label style="display:flex;gap:8px;align-items:center;margin-top:10px;font-size:13px;">
  <input type="checkbox" id="recurringEnabled" onchange="updateRecurringPreview()">
  Diesen Auftrag wiederholen
</label>

<select id="recurringInterval" class="input" onchange="updateRecurringPreview()">
  <option value="weekly">Woechentlich</option>
  <option value="monthly" selected>Monatlich</option>
  <option value="custom_months">Alle X Monate</option>
  <option value="yearly">Jaehrlich</option>
</select>

<input
  type="number"
  id="recurringIntervalMonths"
  class="input"
  min="1"
  step="1"
  value="3"
  style="display:none;"
  oninput="updateRecurringPreview()"
>

<select id="recurringMode" class="input">
  <option value="reminder">Als Erinnerung vorbereiten</option>
  <option value="auto_create">Auftrag automatisch anlegen</option>
</select>

<input
  type="number"
  id="recurringReminderDays"
  class="input"
  min="0"
  step="1"
  value="30"
  placeholder="Erinnerung Tage vorher"
>

<select id="recurringMember" class="input"></select>

<label style="display:flex;gap:8px;align-items:center;margin-top:10px;font-size:13px;">
  <input type="checkbox" id="recurringNotifyAssignee">
  Mitarbeiter ebenfalls benachrichtigen
</label>

<p id="recurringPreview" style="font-size:12px;opacity:0.75;margin-top:10px;">&nbsp;</p>

</div>

<button
class="save-btn"
onclick="saveJob()"
>
Speichern
</button>

</div>

</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>
<script src="auth-context.js"></script>
<script src="company-context.js"></script>
<script src="recurring-orders.js"></script>
<script src="work-presets.js"></script>
<script src="auto-textareas.js"></script>

<script>

let selectedCustomer = null;
let selectedProject = null;
let allCustomers = [];

loadCustomerOptions();
renderFavoriteMaterials();
renderTemplates();
initRecurringOptions();

const dueInputForRecurring =
  document.getElementById("faelligkeit");

if(dueInputForRecurring){
  dueInputForRecurring.addEventListener(
    "input",
    updateRecurringPreview
  );
}

function renderFavoriteMaterials(){

  const target =
    document.getElementById("favoriteMaterialList");

  if(!target || !window.BaudokuPresets) return;

  const favorites =
    window.BaudokuPresets.getMaterialFavorites();

  target.innerHTML = "";

  favorites.forEach(item => {
    const button =
      document.createElement("button");

    button.type = "button";
    button.className = "result-item";
    button.style.margin = "0";
    button.style.padding = "8px 10px";
    button.style.width = "auto";
    button.textContent = item;

    button.onclick = () => {
      const field =
        document.getElementById("material");

      field.value =
        field.value.trim()
          ? field.value.trim() + "\n" + item
          : item;
    };

    target.appendChild(button);
  });
}

function renderTemplates(){

  const target =
    document.getElementById("templateList");

  if(!target || !window.BaudokuPresets) return;

  const templates =
    window.BaudokuPresets.getJobTemplates();

  if(!templates.length){
    target.innerHTML =
      "<p style='opacity:0.7;'>Noch keine Vorlagen gespeichert.</p>";
    return;
  }

  target.innerHTML = "";

  templates.forEach(template => {
    const div =
      document.createElement("div");

    div.className = "result-item";

    div.innerHTML = `
      <strong>${template.name}</strong>
      <div style="opacity:0.8;margin-top:6px;">
        ${template.beschreibung || "Ohne Beschreibung"}
      </div>
      <div style="display:flex;gap:8px;margin-top:10px;">
        <button type="button" class="save-btn" style="margin:0;padding:10px;background:#ff6b3d;" onclick="applyTemplate('${template.id}')">Anwenden</button>
        <button type="button" class="save-btn" style="margin:0;padding:10px;background:#444;" onclick="removeTemplate('${template.id}')">Löschen</button>
      </div>
    `;

    target.appendChild(div);
  });
}

function saveCurrentMaterialFavorite(){

  const value =
    document.getElementById("material").value
      .split("\n")
      .map(line => line.trim())
      .filter(Boolean)[0];

  if(!value || !window.BaudokuPresets) return;

  window.BaudokuPresets.saveMaterialFavorite(value);
  renderFavoriteMaterials();
}

function saveCurrentTemplate(){

  if(!window.BaudokuPresets) return;

  const name =
    prompt("Name der Vorlage:");

  if(!name) return;

  window.BaudokuPresets.saveJobTemplate({
    name,
    beschreibung: document.getElementById("beschreibung").value.trim(),
    material: document.getElementById("material").value.trim(),
    priority: document.getElementById("priority").value
  });

  renderTemplates();
}

function applyTemplate(id){

  if(!window.BaudokuPresets) return;

  const template =
    window.BaudokuPresets
      .getJobTemplates()
      .find(item => item.id === id);

  if(!template) return;

  document.getElementById("beschreibung").value =
    template.beschreibung || "";

  document.getElementById("material").value =
    template.material || "";

  document.getElementById("priority").value =
    template.priority || "normal";
}

function removeTemplate(id){

  if(!window.BaudokuPresets) return;

  window.BaudokuPresets.removeJobTemplate(id);
  renderTemplates();
}

async function initRecurringOptions(){

  const card =
    document.getElementById("recurringCard");

  const memberSelect =
    document.getElementById("recurringMember");

  if(memberSelect){
    memberSelect.innerHTML =
      "<option value=''>Kein Mitarbeiter</option>";
  }

  if(!window.BaudokuAuthContext || !window.BautrailRecurringOrders){
    updateRecurringPreview();
    return;
  }

  const ctx =
    await window.BaudokuAuthContext
      .loadAuthContext({ noCache:true });

  if(
    card &&
    !window.BautrailRecurringOrders
      .isManager(ctx)
  ){
    card.style.display = "none";
    return;
  }

  if(ctx && ctx.company_id && memberSelect){
    const { data, error } =
      await db
        .from("company_members")
        .select("user_id, name, email, role, active")
        .eq("company_id", ctx.company_id)
        .eq("active", true)
        .order("name", { ascending:true });

    if(error){
      console.log(error);
    }

    (data || [])
      .filter(member => member.role === "angestellter")
      .forEach(member => {
        const option =
          document.createElement("option");

        option.value =
          member.user_id;

        option.textContent =
          member.name ||
          member.email ||
          "Mitarbeiter";

        memberSelect.appendChild(option);
      });
  }

  updateRecurringPreview();
}

function updateRecurringPreview(){

  const enabled =
    document.getElementById("recurringEnabled");

  const interval =
    document.getElementById("recurringInterval");

  const months =
    document.getElementById("recurringIntervalMonths");

  const preview =
    document.getElementById("recurringPreview");

  if(!interval || !months || !preview) return;

  months.style.display =
    interval.value === "custom_months"
      ? "block"
      : "none";

  if(!enabled || !enabled.checked){
    preview.textContent =
      "Keine Wiederholung aktiv.";
    return;
  }

  const due =
    document.getElementById("faelligkeit")
      .value;

  if(!due || !window.BautrailRecurringOrders){
    preview.textContent =
      "Bitte zuerst eine Faelligkeit setzen.";
    return;
  }

  const rule = {
    interval_type:
      interval.value,
    interval_months:
      Number(months.value || 1)
  };

  const next =
    window.BautrailRecurringOrders
      .advanceDueDate(due, rule);

  preview.textContent =
    "Naechste automatische Faelligkeit: " +
    window.BautrailRecurringOrders
      .formatDateDe(next);
}

async function createRecurringFromSavedJob(savedJob){

  const enabled =
    document.getElementById("recurringEnabled");

  if(!enabled || !enabled.checked) return;

  if(!window.BaudokuAuthContext || !window.BautrailRecurringOrders){
    return;
  }

  const ctx =
    await window.BaudokuAuthContext
      .loadAuthContext({ noCache:true });

  if(
    !ctx ||
    !ctx.company_id ||
    !window.BautrailRecurringOrders
      .isManager(ctx)
  ){
    return;
  }

  const due =
    document.getElementById("faelligkeit")
      .value ||
    window.BautrailRecurringOrders
      .todayKey();

  const intervalType =
    document.getElementById("recurringInterval")
      .value;

  const intervalMonths =
    Math.max(
      1,
      Number(
        document.getElementById(
          "recurringIntervalMonths"
        ).value || 1
      )
    );

  const nextDue =
    window.BautrailRecurringOrders
      .advanceDueDate(due, {
        interval_type: intervalType,
        interval_months: intervalMonths
      });

  const payload = {
    company_id: ctx.company_id,
    customer_id: selectedCustomer.id,
    project_id: selectedProject.id,
    template_auftrag_id:
      savedJob && savedJob.id
        ? savedJob.id
        : null,
    customer: selectedCustomer.name,
    project: selectedProject.name,
    beschreibung:
      document.getElementById(
        "beschreibung"
      ).value,
    priority:
      document.getElementById(
        "priority"
      ).value,
    interval_type: intervalType,
    interval_months: intervalMonths,
    next_due_date: nextDue,
    last_created_due_date: due,
    reminder_days_before:
      Math.max(
        0,
        Number(
          document.getElementById(
            "recurringReminderDays"
          ).value || 0
        )
      ),
    mode:
      document.getElementById(
        "recurringMode"
      ).value,
    assigned_user_id:
      document.getElementById(
        "recurringMember"
      ).value || null,
    notify_assignee:
      document.getElementById(
        "recurringNotifyAssignee"
      ).checked,
    created_by:
      ctx.user_id || null,
    active:true
  };

  const { error } =
    await db
      .from("recurring_orders")
      .insert([payload]);

  if(error){
    console.log(error);
    alert(
      "Auftrag gespeichert, aber die Wiederholung konnte nicht angelegt werden."
    );
  }
}

async function loadCustomerOptions(){

  const cached =
    JSON.parse(
      localStorage.getItem("customers")
    ) || [];

  allCustomers = cached;

  if(!navigator.onLine) return;

  const { data, error } =
    await window.BaudokuCompanyContext
      .selectScoped("customers");

  if(error){

    console.log(error);
    return;
  }

  allCustomers =
    (data || [])
      .sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));

  localStorage.setItem(
    "customers",
    JSON.stringify(allCustomers)
  );
}

function getCustomerName(customer){

  return customer.firma ||
    (
      customer.vorname &&
      customer.nachname
        ? customer.vorname + " " + customer.nachname
        : ""
    );
}

function sameText(a,b){

  return String(a || "")
    .trim()
    .toLowerCase() ===
    String(b || "")
    .trim()
    .toLowerCase();
}

async function loadProjectsForCustomer(customerId){

  if(
    !customerId ||
    String(customerId).startsWith("custom_") ||
    !navigator.onLine
  ){
    return;
  }

  let query =
    db
      .from("projects")
      .select("*")
      .eq("customer_id", customerId)
      .order("created_at", {
        ascending:false
      });

  const ctx =
    window.BaudokuAuthContext
      ? await window.BaudokuAuthContext.loadAuthContext({ noCache: true })
      : null;

  if (!(ctx && ctx.company_id)) {
    return;
  }

  const { data, error } = await query.eq("company_id", ctx.company_id);

  if(error){
    console.log(error);
    return;
  }

  localStorage.setItem(
    "projects_" + customerId,
    JSON.stringify(data || [])
  );
}

function searchCustomers(){

  const input =
    document.getElementById(
      "customerSearch"
    );

  const value =
    input.value.toLowerCase();

  const results =
    document.getElementById(
      "customerResults"
    );

  results.innerHTML = "";

  if(!value) return;

  const customers =
    allCustomers.length
      ? allCustomers
      : JSON.parse(
          localStorage.getItem("customers")
        ) || [];

  const filtered =
    customers.filter(c => {

      const name =
        getCustomerName(c)
        .toLowerCase();

      return name.includes(value);

    });

  filtered.forEach(c => {

    const name =
      getCustomerName(c);

    const div =
      document.createElement("div");

    div.className =
      "result-item";

    div.innerHTML = `
      <strong style="color:white;">
        ${name}
      </strong>
    `;

    div.onclick = () => {

      selectedCustomer = {
        id:c.id,
        name:name
      };

      input.value = name;

      results.innerHTML = "";

      document.getElementById(
        "projectSearch"
      ).disabled = false;

      loadProjectsForCustomer(c.id);
    };

    results.appendChild(div);

  });

  // 🔥 FREIEN TEXT ERLAUBEN
  if(!filtered.length){

    const div =
      document.createElement("div");

    div.className =
      "result-item";

    div.innerHTML = `
      <strong style="color:white;">
        ➕ Neuer Kunde:
        ${input.value}
      </strong>
    `;

    div.onclick = () => {

      selectedCustomer = {
        id:"custom_" + Date.now(),
        name:input.value
      };

      results.innerHTML = "";

      document.getElementById(
        "projectSearch"
      ).disabled = false;
    };

    results.appendChild(div);
  }

}

function searchProjects(){

  const input =
    document.getElementById(
      "projectSearch"
    );

  const value =
    input.value.toLowerCase();

  const results =
    document.getElementById(
      "projectResults"
    );

  results.innerHTML = "";

  if(!value) return;

  let projects = [];

  if(
    selectedCustomer &&
    !String(selectedCustomer.id)
    .startsWith("custom_")
  ){

    projects =
      JSON.parse(
        localStorage.getItem(
          "projects_" +
          selectedCustomer.id
        )
      ) || [];
  }

  const filtered =
    projects.filter(p =>
      p.name
      .toLowerCase()
      .includes(value)
    );

  filtered.forEach(p => {

    const div =
      document.createElement("div");

    div.className =
      "result-item";

    div.innerHTML = `
      <strong style="color:white;">
        ${p.name}
      </strong>
    `;

    div.onclick = () => {

      selectedProject = {
        id:p.id,
        name:p.name
      };

      input.value = p.name;

      results.innerHTML = "";
    };

    results.appendChild(div);

  });

  // 🔥 FREIES PROJEKT
  if(!filtered.length){

    const div =
      document.createElement("div");

    div.className =
      "result-item";

    div.innerHTML = `
      <strong style="color:white;">
        ➕ Neues Projekt:
        ${input.value}
      </strong>
    `;

    div.onclick = () => {

      selectedProject = {
        id:"custom_" + Date.now(),
        name:input.value
      };

      results.innerHTML = "";
    };

    results.appendChild(div);
  }

}


async function saveJob(){
  if(!selectedCustomer){

  const customerValue =
    document.getElementById(
      "customerSearch"
    ).value.trim();

  if(customerValue){

    selectedCustomer = {

      id:"custom_" + Date.now(),

      name:customerValue
    };
  }
}

if(!selectedProject){

  const projectValue =
    document.getElementById(
      "projectSearch"
    ).value.trim();

  if(projectValue){

    selectedProject = {

      id:"custom_" + Date.now(),

      name:projectValue
    };
  }
}

  if(!selectedCustomer){

    alert("Kunde fehlt");
    return;
  }

  if(!selectedProject){

    alert("Projekt fehlt");
    return;
  }

  // 🔥 Neuen Kunden speichern
 // 🔥 Neuen Kunden in Supabase speichern
try{

  await ensureCustomerSaved();

} catch(error){

  return;
}
  // 🔥 Neues Projekt speichern
  // 🔥 Neues Projekt in Supabase speichern
try{

  await ensureProjectSaved();

} catch(error){

  return;
}

  const { data:savedJobData, error } =
  await window.BaudokuCompanyContext
  .insertScoped("auftraege", {

    customer:
      selectedCustomer.name,

    customer_id:
      selectedCustomer.id,

    project:
      selectedProject.name,

    project_id:
      selectedProject.id,

    beschreibung:
      document.getElementById(
        "beschreibung"
      ).value,

    priority:
      document.getElementById(
        "priority"
      ).value,

   faelligkeit:

  document.getElementById(
    "faelligkeit"
  ).value || null,

    done:false
  });

if(error){

  console.log(error);

  alert(error.message);

  return;
}

const savedJob =
  Array.isArray(savedJobData)
    ? savedJobData[0]
    : savedJobData;

await createRecurringFromSavedJob(
  savedJob
);

window.location.href =
  "auftraege.html";
  }

async function ensureCustomerSaved(){

  const customerName =
    selectedCustomer.name.trim();

  const cachedMatch =
    (
      JSON.parse(
        localStorage.getItem("customers")
      ) || []
    ).find(c =>
      sameText(
        getCustomerName(c),
        customerName
      )
    );

  if(cachedMatch){

    selectedCustomer.id =
      cachedMatch.id;

    selectedCustomer.name =
      getCustomerName(cachedMatch);

    return;
  }

  if(
    !String(selectedCustomer.id)
    .startsWith("custom_")
  ){
    return;
  }

  const { data:newCustomerData, error } =
    await window.BaudokuCompanyContext
    .insertScoped("customers", {

      firma:
        customerName,

      vorname:"",
      nachname:""

    });

  const newCustomer =
    Array.isArray(newCustomerData)
      ? newCustomerData[0]
      : newCustomerData;

  if(error){

    console.log(error);
    alert(error.message);
    throw error;
  }

  selectedCustomer.id =
    newCustomer.id;

  selectedCustomer.name =
    getCustomerName(newCustomer);

  const customers =
    JSON.parse(
      localStorage.getItem("customers")
    ) || [];

  customers.unshift(newCustomer);

  localStorage.setItem(
    "customers",
    JSON.stringify(customers)
  );
}

async function ensureProjectSaved(){

  const projectName =
    selectedProject.name.trim();

  if(
    !String(selectedProject.id)
    .startsWith("custom_")
  ){
    return;
  }

  const projectPayload = {

    customer_id:
      selectedCustomer.id,

    customer:
      selectedCustomer.name,

    name:
      projectName,

    material:"",

    faelligkeit:
      document.getElementById(
        "faelligkeit"
      ).value || null,

    beschreibung:
      document.getElementById(
        "beschreibung"
      ).value
  };

  const { data:newProjectData, error } =
    await window.BaudokuCompanyContext
    .insertScoped("projects", projectPayload);

  const newProject =
    Array.isArray(newProjectData)
      ? newProjectData[0]
      : newProjectData;

  if(error){

    console.log(error);
    alert(error.message);
    throw error;
  }

  selectedProject.id =
    newProject.id;

  selectedProject.name =
    newProject.name;

  const cacheKey =
    "projects_" +
    selectedCustomer.id;

  const projects =
    JSON.parse(
      localStorage.getItem(cacheKey)
    ) || [];

  projects.unshift(newProject);

  localStorage.setItem(
    cacheKey,
    JSON.stringify(projects)
  );

  localStorage.setItem(
    "project_" + newProject.id,
    JSON.stringify(newProject)
  );
}

function goBack(){

  window.history.back();
}


</script>
