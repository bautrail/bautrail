<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kunde anlegen</title>
  <link rel="stylesheet" href="style.css">

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="auth-context.js"></script>
  <script src="company-context.js"></script>

  <script>
    window.addEventListener("load", async () => {
      const { data } = await db.auth.getSession();
      if (!data.session) {
        window.location.href = "login.html";
      }
    });
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#ff6b3d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Baudoku">
  <link rel="icon" href="assets/app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
</head>

<body>

<div class="app-wrapper">

  <div class="app-content">

    <header class="app-header">
      <h1>Neuer Kunde</h1>
      <p class="subtitle">Kundendaten eingeben</p>
    </header>

    <div class="customer-form">

      <!-- ?? Firma -->
      <input type="text" id="firma" placeholder="Firmenname (optional)">

      <!-- ?? Ansprechpartner -->
      <input type="text" id="ansprechpartner" placeholder="Ansprechpartner (optional)">

      <!-- ?? Privatkunde -->
      <input type="text" id="vorname" placeholder="Vorname (bei Privatkunde)">
      <input type="text" id="nachname" placeholder="Nachname (bei Privatkunde)">

      <!-- Kontakt -->
      <input type="text" id="telefon" placeholder="Telefon">
      <input type="email" id="email" placeholder="E-Mail">
      <input type="text" id="adresse" placeholder="Adresse">

      <button onclick="saveCustomer()" class="login-btn">
        Speichern
      </button>

      <p id="msg" style="text-align:center;margin-top:10px;color:#ff3b3b;"></p>

    </div>

  </div>

  <nav class="bottom-nav">
    <a href="index.html"><span>&#127968;</span><small>&Uuml;bersicht</small></a>

    <a href="kunden.html" class="active"><span>&#128101;</span><small>Kunden</small></a>

    <a href="zeiten.html"><span>&#9201;&#65039;</span><small>Zeiten</small></a>

    <a href="profil.html"><span>&#128100;</span><small>Profil</small></a>
  </nav>

</div>

<script>

async function saveCustomer() {

  const firma = document.getElementById("firma").value.trim();
  const ansprechpartner = document.getElementById("ansprechpartner").value.trim();
  const vorname = document.getElementById("vorname").value.trim();
  const nachname = document.getElementById("nachname").value.trim();
  const telefon = document.getElementById("telefon").value.trim();
  const email = document.getElementById("email").value.trim();
  const adresse = document.getElementById("adresse").value.trim();
  const msg = document.getElementById("msg");

  msg.textContent = "";

  // ?? VALIDIERUNG
  if (!firma && (!vorname || !nachname)) {
    msg.textContent = "Bitte Firma ODER Vor- und Nachname eingeben!";
    return;
  }

  const { error } = await window.BaudokuCompanyContext
    .insertScoped("customers", {
      firma,
      ansprechpartner,
      vorname,
      nachname,
      telefon,
      email,
      adresse
    });

  if (error) {
    msg.textContent = "Fehler beim Speichern";
    console.log(error);
    return;
  }

  window.location.href = "kunden.html";
}

</script>

<script src="pwa.js"></script>
</body>
</html>
