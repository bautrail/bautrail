<!DOCTYPE html>
<html lang="de">
<head>

  <link rel="stylesheet" href="style.css?v=20260524b">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#ff6b3d">

<body class="home-overview">
<div class="app-wrapper">
  <div class="app-content">
    <header class="app-header">
      <img class="app-logo" src="assets/bautrail-logo.png" alt="bautrail">
      <p class="company-name" id="headerCompanyText">Firma<br>-</p>
    </header>

    <div class="task-card home-date-card">
      <small>Heute</small>
      <h2 id="dateTime"></h2>
    </div>

    <div class="task-card home-sync-card">
      <h3>Verbindung und Sync</h3>
      <div id="syncStatusText">Pr&uuml;fe Verbindung...</div>
      <p id="syncStatusHint">-</p>
    </div>

    <div class="task-card home-search-card">
      <h3>&#128269; Globale Suche</h3>
      <input
        id="globalSearchInput"
        type="text"
        placeholder="Globale Suche: Kunde, Projekt, Auftrag, Nachweis"
        class="compact-input"
        oninput="runGlobalSearch()"
      >
      <div id="globalSearchList"></div>
    </div>

    <div class="home-menu-list">
      <button class="home-menu-card" type="button" onclick="openPlanung()">
        <span>&#128197;</span><strong>Planung</strong>
      </button>
      <button class="home-menu-card" type="button" onclick="openAuftraege()">
        <span>&#128203;</span><strong>Auftr&auml;ge</strong>
      </button>
      <button class="home-menu-card" type="button" onclick="openFahrzeugMaterial()">
        <span>&#128666;</span><strong>Fahrzeug Material ersetzen</strong>
      </button>
      <button class="home-menu-card" type="button" onclick="openMaterialBestellen()">
        <span>&#128230;</span><strong>Material bestellen</strong>
      </button>
      <button class="home-menu-card" type="button" onclick="openStundennachweis()">
        <span>&#128221;</span><strong>Stunden Nachweis</strong>
      </button>
      <button class="home-menu-card" type="button" onclick="openMitarbeiter()" data-manager-only="true">
        <span>&#128101;</span><strong>Mitarbeiter &Uuml;bersicht</strong>
      </button>
      <button class="home-menu-card" type="button" onclick="openOffeneLeistungen()" data-manager-only="true">
        <span>&#128176;</span><strong>Offene Leistungen</strong>
      </button>
      <button class="home-menu-card" type="button" onclick="openSchaltplanEditor()">
        <span>&#9889;</span><strong>Schaltplan-Zeichner</strong>
      </button>
      <button class="home-menu-card" type="button" onclick="openFeedback()">
        <span>&#128172;</span><strong>Feedback</strong>
      </button>
    </div>

    <div class="company-info">
      <p id="footerCompanyName">Firma</p>
      <p id="footerCompanyStreet">-</p>
      <p id="footerCompanyCity">-</p>
      <p id="footerCompanyEmail">-</p>
      <p id="footerCompanyPhone">-</p>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="active"><span>&#127968;</span><small>&Uuml;bersicht</small></a>
    <a href="kunden.html"><span>&#128101;</span><small>Kunden</small></a>
    <a href="zeiten.html"><span>&#9201;&#65039;</span><small>Zeiten</small></a>
    <a href="profil.html"><span>&#9881;&#65039;</span><small>Einstellungen</small></a>
  </nav>
</div>

<button class="logout-float" type="button" onclick="logout()">Logout</button>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="auth-context.js"></script>
<script src="role-nav.js"></script>
<script src="notifications.js"></script>

<script>
window.addEventListener("load", () => {
  setTimeout(async () => {
    const { data } = await db.auth.getSession();
    if (!data.session) {
      window.location.href = "login.html";
      return;
    }

    if (window.BaudokuAuthContext) {
      const authContext = await window.BaudokuAuthContext.loadAuthContext();
      if (authContext) window.BAUDOKU_AUTH_CONTEXT = authContext;
    }
  }, 300);
});

async function logout() {
  await db.auth.signOut();
  window.location.href = "login.html";
}

function updateDateTime() {
  const el = document.getElementById("dateTime");
  if (!el) return;

  const now = new Date();
  el.textContent = now.toLocaleString("de-DE", {
    weekday: "long",
    day: "numeric",
    month: "long",
    hour: "2-digit",
    minute: "2-digit"
  });
}

setInterval(updateDateTime, 1000);
updateDateTime();

async function loadCompanyBranding() {
  if (!window.BaudokuAuthContext) return;
  const ctx = await window.BaudokuAuthContext.loadAuthContext({ noCache: true });
  if (!ctx || !ctx.company_id) return;

  const { data, error } = await db
    .from("companies")
    .select("name, company_owner, adresse, plz, ort, email, telefon")
    .eq("id", ctx.company_id)
    .maybeSingle();

  if (error || !data) {
    console.log(error);
    return;
  }

  const header = document.getElementById("headerCompanyText");
  if (header) {
    header.innerHTML = (data.name || "Firma") + "<br>" + (data.company_owner || "-");
  }

  const cityLine = [data.plz || "", data.ort || ""].filter(Boolean).join(" ");
  const map = {
    footerCompanyName: data.name || "Firma",
    footerCompanyStreet: data.adresse || "-",
    footerCompanyCity: cityLine || "-",
    footerCompanyEmail: data.email || "-",
    footerCompanyPhone: data.telefon || "-"
  };

  Object.keys(map).forEach(id => {
    const el = document.getElementById(id);
    if (el) el.textContent = map[id];
  });
}

const SEARCH_CACHE_KEY = "bautrailGlobalSearchCache";

function readSearchCache() {
  try {
    return JSON.parse(localStorage.getItem(SEARCH_CACHE_KEY) || "[]");
  } catch (err) {
    return [];
  }
}

function writeSearchCache(items) {
  localStorage.setItem(SEARCH_CACHE_KEY, JSON.stringify(items || []));
}

function normalizeSearchText(parts) {
  return parts.filter(Boolean).join(" ").toLowerCase();
}

function renderSearchResults(items, offlineMode) {
  const list = document.getElementById("globalSearchList");
  if (!list) return;
  list.innerHTML = "";

  if (!items.length) {
    list.innerHTML = "<p style='opacity:0.7;'>Keine Treffer gefunden.</p>";
    return;
  }

  items.forEach(item => {
    const div = document.createElement("div");
    div.className = "info-box";
    div.style.cursor = "pointer";
    div.style.marginBottom = "8px";
    div.innerHTML =
      "<small>" + (item.item_type || "Eintrag") + (offlineMode ? " | Offline" : "") + "</small>" +
      "<div class=\"text\">" + (item.title || "-") + "</div>" +
      "<small>" + (item.subtitle || "") + "</small>";
    div.onclick = () => {
      if (item.item_type === "customer") window.location.href = "kunde-detail.html?id=" + item.item_id;
      else if (item.item_type === "project") window.location.href = "projekt-detail.html?id=" + item.item_id;
      else if (item.item_type === "auftrag") window.location.href = "auftrag-detail.html?id=" + item.item_id;
      else if (item.item_type === "nachweis") window.location.href = "stunden-nachweis.html";
    };
    list.appendChild(div);
  });
}

function buildOfflineSearchItems() {
  const items = [];
  const customers = JSON.parse(localStorage.getItem("customers") || "[]");

  customers.forEach(c => {
    const title = c.firma || [c.vorname, c.nachname].filter(Boolean).join(" ") || "Kunde";
    items.push({
      item_type: "customer",
      item_id: c.id,
      title,
      subtitle: [c.telefon, c.email, c.adresse, c.plz, c.ort].filter(Boolean).join(" | "),
      search_text: normalizeSearchText([title, c.vorname, c.nachname, c.telefon, c.email, c.adresse, c.plz, c.ort])
    });
  });

  Object.keys(localStorage).filter(key => key.startsWith("projects_")).forEach(key => {
    try {
      const projects = JSON.parse(localStorage.getItem(key) || "[]");
      projects.forEach(project => {
        items.push({
          item_type: "project",
          item_id: project.id,
          title: project.name || "Projekt",
          subtitle: [project.customer, project.ort, project.adresse].filter(Boolean).join(" | "),
          search_text: normalizeSearchText([project.name, project.customer, project.ort, project.adresse, project.project_number])
        });
      });
    } catch (err) {
      console.log(err);
    }
  });

  return items;
}

async function loadOnlineSearchItems() {
  const queries = await Promise.all([
    db.from("customers").select("*").order("created_at", { ascending: false }).limit(150),
    db.from("projects").select("*").order("created_at", { ascending: false }).limit(150),
    db.from("auftraege").select("*").order("created_at", { ascending: false }).limit(150),
    db.from("stundennachweise").select("*").order("created_at", { ascending: false }).limit(150)
  ]);

  queries.forEach(result => result.error && console.log(result.error));

  const customers = (queries[0].data || []).map(c => ({
    item_type: "customer",
    item_id: c.id,
    title: c.firma || [c.vorname, c.nachname].filter(Boolean).join(" ") || "Kunde",
    subtitle: [c.telefon, c.email, c.adresse, c.plz, c.ort].filter(Boolean).join(" | "),
    search_text: normalizeSearchText([c.firma, c.vorname, c.nachname, c.telefon, c.email, c.adresse, c.plz, c.ort])
  }));

  const projects = (queries[1].data || []).map(p => ({
    item_type: "project",
    item_id: p.id,
    title: p.name || "Projekt",
    subtitle: [p.customer, p.ort, p.adresse, p.project_number].filter(Boolean).join(" | "),
    search_text: normalizeSearchText([p.name, p.customer, p.ort, p.adresse, p.project_number])
  }));

  const orders = (queries[2].data || []).map(o => ({
    item_type: "auftrag",
    item_id: o.id,
    title: [o.customer || "Kunde", o.project || o.objekt || "Auftrag"].join(" - "),
    subtitle: [o.faelligkeit, o.objekt, o.auftragsnummer, o.beschreibung].filter(Boolean).join(" | "),
    search_text: normalizeSearchText([o.customer, o.project, o.objekt, o.auftragsnummer, o.beschreibung, o.faelligkeit])
  }));

  const reports = (queries[3].data || []).map(r => ({
    item_type: "nachweis",
    item_id: r.id,
    title: [r.customer || "Kunde", r.objekt || "Nachweis"].join(" - "),
    subtitle: [r.arbeitsdatum, r.project, r.report_number, r.gefahrene_kilometer ? (r.gefahrene_kilometer + " km") : ""].filter(Boolean).join(" | "),
    search_text: normalizeSearchText([r.customer, r.objekt, r.project, r.arbeitsdatum, r.report_number])
  }));

  const items = customers.concat(projects, orders, reports);
  writeSearchCache(items);
  return items;
}

async function runGlobalSearch() {
  const input = document.getElementById("globalSearchInput");
  const list = document.getElementById("globalSearchList");
  if (!input || !list) return;

  const value = input.value.trim().toLowerCase();
  list.innerHTML = "";
  if (!value) return;

  let items = [];
  let offlineMode = !navigator.onLine;

  if (navigator.onLine) {
    try {
      items = await loadOnlineSearchItems();
    } catch (error) {
      console.log(error);
      offlineMode = true;
    }
  }

  if (!items.length) {
    items = readSearchCache().concat(buildOfflineSearchItems());
    offlineMode = true;
  }

  const seen = new Set();
  const filtered = items.filter(item => {
    const key = String(item.item_type || "") + ":" + String(item.item_id || item.title || "");
    if (seen.has(key)) return false;
    seen.add(key);
    return String(item.search_text || normalizeSearchText([item.title, item.subtitle])).includes(value);
  }).slice(0, 20);

  if (!filtered.length && offlineMode) {
    list.innerHTML = "<p style='opacity:0.7;'>Offline keine passenden Treffer im lokalen Cache gefunden.</p>";
    return;
  }

  renderSearchResults(filtered, offlineMode);
}

function pendingSyncCount() {
  const keys = [
    "offlineUploads",
    "deleteQueue",
    "projectUpdateQueue",
    "projectDocumentFiles",
    "projectDocumentFolders",
    "projectImageFolders"
  ];

  return keys.reduce((sum, key) => {
    try {
      const value = JSON.parse(localStorage.getItem(key) || "[]");
      if (!Array.isArray(value)) return sum;
      if (key === "projectDocumentFiles" || key === "projectDocumentFolders") {
        return sum + value.filter(item => item && item.synced !== true).length;
      }
      return sum + value.length;
    } catch (err) {
      return sum;
    }
  }, 0);
}

function updateSyncOverview() {
  const text = document.getElementById("syncStatusText");
  const hint = document.getElementById("syncStatusHint");
  if (!text || !hint) return;

  const pending = pendingSyncCount();

  if (!navigator.onLine) {
    text.textContent = "Offline";
    text.style.color = "#ffb14a";
    hint.textContent = pending ? (pending + " \u00c4nderungen warten auf Synchronisierung.") : "Keine aktive Internetverbindung.";
    return;
  }

  if (pending > 0) {
    text.textContent = "Online - Synchronisierung offen";
    text.style.color = "#ffb14a";
    hint.textContent = pending + " lokale \u00c4nderungen werden bei Verbindung abgeglichen.";
    return;
  }

  text.textContent = "Online und synchron";
  text.style.color = "#9be15d";
  hint.textContent = "Alle lokalen Daten sind im Moment synchron.";
}

function openPlanung() {
  window.location.href = "planung.html";
}

function openAuftraege() {
  window.location.href = "auftraege.html";
}

function openFahrzeugMaterial() {
  window.location.href = "fahrzeug-material.html";
}

function openMaterialBestellen() {
  window.location.href = "material-bestellen.html";
}

function openStundennachweis() {
  window.location.href = "stunden-nachweis.html";
}

function openMitarbeiter() {
  window.location.href = "mitarbeiter.html";
}

function openOffeneLeistungen() {
  window.location.href = "offene-leistungen.html";
}

function openSchaltplanEditor() {
  window.location.href = "schaltplan-zeichner.html";
}

function openFeedback() {
  window.location.href = "feedback.html";
}

async function applyRoleOverviewVisibility() {
  if (!window.BaudokuAuthContext) return;
  const ctx = await window.BaudokuAuthContext.loadAuthContext({ noCache: true });
  if (!ctx) return;

  if (ctx.role === "angestellter") {
    Array.from(document.querySelectorAll("[data-manager-only='true']")).forEach(item => {
      item.style.display = "none";
    });
  }
}

loadCompanyBranding();
updateSyncOverview();
applyRoleOverviewVisibility();
window.addEventListener("online", updateSyncOverview);
window.addEventListener("offline", updateSyncOverview);
window.addEventListener("focus", updateSyncOverview);
</script>

</body>
