<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wecker Einstellungen - bautrail</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#ff6b3d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="bautrail">
  <link rel="icon" href="assets/bautrail-icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/bautrail-apple-touch-icon.png">
</head>
<body>
<div class="app-wrapper">
  <div class="app-content">
    <header class="app-header">
      <button class="back-btn" onclick="window.location.href='profil.html'">&#8592;</button>
      <h1 class="app-name">Wecker Einstellungen</h1>
      <p class="company-name">Benachrichtigungszeiten (online)</p>
    </header>

    <div class="task-card">
      <label style="display:block;font-size:12px;opacity:0.75;">Fahrzeug Material ersetzen</label>
      <input id="vehicleTime" type="time" class="compact-input" style="margin-top:6px;">
      <label style="display:block;font-size:12px;opacity:0.75;margin-top:10px;">Material bestellen</label>
      <input id="orderTime" type="time" class="compact-input" style="margin-top:6px;">
      <label style="display:block;font-size:12px;opacity:0.75;margin-top:10px;">Kundenmaterial für morgen</label>
      <input id="customerMaterialTime" type="time" class="compact-input" style="margin-top:6px;">
      <label style="display:flex;gap:8px;align-items:center;font-size:12px;opacity:0.9;margin-top:12px;">
        <input id="dailyReportEnabled" type="checkbox" checked> Stundennachweis-Erinnerung aktiv
      </label>
      <input id="dailyReportTime" type="time" class="compact-input" style="margin-top:6px;">
      <label style="display:flex;gap:8px;align-items:center;font-size:12px;opacity:0.9;margin-top:12px;">
        <input id="timesheetEnabled" type="checkbox" checked> Arbeitszeit-Erinnerung aktiv
      </label>
      <input id="timesheetTime" type="time" class="compact-input" style="margin-top:6px;">
      <label style="display:flex;gap:8px;align-items:center;font-size:12px;opacity:0.9;margin-top:12px;">
        <input id="dueOrderEnabled" type="checkbox" checked> Erinnerung bei faelligen Auftraegen aktiv
      </label>
      <input id="dueOrderTime" type="time" class="compact-input" style="margin-top:6px;">
      <label style="display:flex;gap:8px;align-items:center;font-size:12px;opacity:0.9;margin-top:12px;">
        <input id="newReportEnabled" type="checkbox" checked> Chef/Buero bei neuen Nachweisen informieren
      </label>
      <button class="login-btn" style="margin-top:10px;" onclick="saveAlarmSettings()">Speichern</button>
      <button class="login-btn" style="background:#444;margin-top:0;" onclick="enableNotifications()">Benachrichtigungen erlauben</button>
      <p id="alarmStatus" style="font-size:12px;opacity:0.9;min-height:18px;">&nbsp;</p>
    </div>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="auth-context.js"></script>
<script src="notifications.js"></script>
<script>
let authContext = null;

function setStatus(text, ok) {
  const s = document.getElementById("alarmStatus");
  s.textContent = text || "\u00A0";
  s.style.color = ok ? "#4caf50" : "#ff3b3b";
  if (text) {
    setTimeout(() => {
      if (s.textContent === text) s.textContent = "\u00A0";
    }, 2500);
  }
}

async function loadAlarmSettings() {
  if (!authContext || !authContext.company_id) return;
  const { data, error } = await db
    .from("companies")
    .select("*")
    .eq("id", authContext.company_id)
    .maybeSingle();

  if (error || !data) {
    console.log(error);
    setStatus("Konnte Weckerzeiten nicht laden.", false);
    return;
  }

  document.getElementById("vehicleTime").value = data.vehicle_time || "06:30";
  document.getElementById("orderTime").value = data.order_time || "16:30";
  document.getElementById("customerMaterialTime").value = data.customer_material_time || "18:00";
  document.getElementById("dailyReportTime").value = data.daily_report_time || "17:30";
  document.getElementById("timesheetTime").value = data.timesheet_time || "17:45";
  document.getElementById("dueOrderTime").value = data.due_order_time || "07:00";
  document.getElementById("dailyReportEnabled").checked = data.daily_report_reminder_enabled !== false;
  document.getElementById("timesheetEnabled").checked = data.timesheet_reminder_enabled !== false;
  document.getElementById("dueOrderEnabled").checked = data.due_order_reminder_enabled !== false;
  document.getElementById("newReportEnabled").checked = data.new_report_notification_enabled !== false;
}

async function saveAlarmSettings() {
  if (!authContext || !authContext.company_id) {
    setStatus("Keine Firmen-Zuordnung gefunden.", false);
    return;
  }
  const payload = {
    vehicle_time: document.getElementById("vehicleTime").value || "06:30",
    order_time: document.getElementById("orderTime").value || "16:30",
    customer_material_time: document.getElementById("customerMaterialTime").value || "18:00",
    daily_report_time: document.getElementById("dailyReportTime").value || "17:30",
    timesheet_time: document.getElementById("timesheetTime").value || "17:45",
    due_order_time: document.getElementById("dueOrderTime").value || "07:00",
    daily_report_reminder_enabled: document.getElementById("dailyReportEnabled").checked,
    timesheet_reminder_enabled: document.getElementById("timesheetEnabled").checked,
    due_order_reminder_enabled: document.getElementById("dueOrderEnabled").checked,
    new_report_notification_enabled: document.getElementById("newReportEnabled").checked
  };

  async function updateWithFallback(source) {
    let safe = { ...source };
    let result = await db.from("companies").update(safe).eq("id", authContext.company_id);
    let guard = 0;
    while (result.error && guard < 10) {
      const msg = String(result.error.message || "");
      const match = msg.match(/column\s+"([^"]+)"/i) || msg.match(/column\s+'([^']+)'/i);
      if (!match || !match[1] || !(match[1] in safe)) break;
      delete safe[match[1]];
      result = await db.from("companies").update(safe).eq("id", authContext.company_id);
      guard += 1;
    }
    return result;
  }

  const { error } = await updateWithFallback(payload);

  if (error) {
    console.log(error);
    setStatus("Speichern fehlgeschlagen: " + (error.message || "Unbekannter Fehler"), false);
    return;
  }
  if (window.BaudokuNotifications) {
    window.BaudokuNotifications.saveSettings({
      vehicleTime: payload.vehicle_time,
      orderTime: payload.order_time,
      customerMaterialTime: payload.customer_material_time,
      dailyReportTime: payload.daily_report_time,
      timesheetTime: payload.timesheet_time,
      dueOrderTime: payload.due_order_time,
      dailyReportReminderEnabled: payload.daily_report_reminder_enabled,
      timesheetReminderEnabled: payload.timesheet_reminder_enabled,
      dueOrderReminderEnabled: payload.due_order_reminder_enabled,
      newReportNotificationEnabled: payload.new_report_notification_enabled
    });
  }
  setStatus("Gespeichert", true);
}

async function enableNotifications() {
  const allowed = await window.BaudokuNotifications.ensurePermission();
  setStatus(allowed ? "Benachrichtigungen sind erlaubt." : "Benachrichtigungen sind nicht erlaubt.", allowed);
}

(async function() {
  authContext = window.BaudokuAuthContext
    ? await window.BaudokuAuthContext.loadAuthContext({ noCache: true })
    : null;
  if (!authContext) {
    window.location.href = "login.html";
    return;
  }
  await loadAlarmSettings();
})();
</script>
<script src="pwa.js"></script>
</body>
</html>
