<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chef Dashboard - bautrail</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#ff6b3d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="bautrail">
  <link rel="icon" href="assets/bautrail-icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/bautrail-apple-touch-icon.png">
</head>
<body>
<div class="app-wrapper">
  <div class="app-content">
    <header class="app-header">
      <button class="back-btn" onclick="window.location.href='index.html'">&#8592;</button>
      <h1 class="app-name">Chef Dashboard</h1>
      <p class="company-name" id="companySubline">Firmensteuerung</p>
    </header>

    <div class="task-card">
      <h3>&#127970; Firmenuebersicht</h3>
      <p id="roleInfo" style="opacity:0.8;margin-top:8px;">Lade Daten...</p>
      <div class="button-row" style="margin-top:10px;">
        <button class="login-btn" style="margin-bottom:0;" onclick="window.location.href='firma-einstellungen.html'">Firma einstellen</button>
        <button class="login-btn" style="margin-bottom:0;background:#444;" onclick="window.location.href='index.html'">Zur Uebersicht</button>
      </div>
    </div>

    <div class="task-card">
      <h3>&#9993;&#65039; Einladungscode erstellen</h3>
      <div class="button-row" style="margin-top:8px;">
        <select id="inviteRole" class="compact-input">
          <option value="buero">Buero</option>
          <option value="angestellter">Angestellter</option>
        </select>
        <button class="login-btn" style="margin-bottom:0;" onclick="createInvite()">Code erstellen</button>
      </div>
      <p id="inviteResult" style="margin-top:10px;font-weight:700;"></p>
      <p id="inviteStatus" style="font-size:12px;opacity:0.75;"></p>
    </div>
    <div class="task-card">
      <h3>&#128230; Kundendaten Download</h3>
      <p style="font-size:12px;opacity:0.75;margin-top:8px;">Erstellt einen ZIP-Ordner mit Kunden, Projekten, Auftraegen und Stundennachweisen deiner Firma.</p>
      <button class="login-btn" style="margin-top:10px;margin-bottom:0;" onclick="downloadCustomerDataArchive()">Kundendaten herunterladen</button>
      <p id="customerExportStatus" style="font-size:12px;opacity:0.8;min-height:18px;margin-top:8px;">&nbsp;</p>
    </div>

    <div class="task-card">
      <h3>&#128101; Mitarbeiterliste</h3>
      <div id="memberList" style="margin-top:10px;"></div>
    </div>

    <div class="task-card">
      <h3>&#128663; Kilometeruebersicht</h3>
      <div class="button-row" style="margin-top:8px;">
        <input id="mileageMonth" type="month" class="compact-input">
        <button class="login-btn" style="margin-bottom:0;" onclick="loadMileageOverview()">Aktualisieren</button>
      </div>
      <div id="mileageOverview" style="margin-top:10px;"></div>
    </div>

    <div class="task-card">
      <h3>&#128221; Offene Stundenzettel</h3>
      <div id="timesheetList" style="margin-top:10px;"></div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="supabase.js"></script>
<script src="auth-context.js"></script>
<script>
let authContext = null;
let company = null;
let membersCache = [];

function randomInviteCode() {
  const alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  const pick = (len) => Array.from({ length: len }, () => alphabet[Math.floor(Math.random() * alphabet.length)]).join("");
  return "BAU-" + pick(5) + "-" + pick(5);
}

function setInviteStatus(text, ok) {
  const el = document.getElementById("inviteStatus");
  el.textContent = text || "";
  el.style.color = ok ? "#6bd86b" : "#ff6b3d";
}

function escapeHtml(value) {
  return String(value || "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[char]));
}

function defaultMonthValue() {
  const today = new Date();
  return today.getFullYear() + "-" + String(today.getMonth() + 1).padStart(2, "0");
}

function monthBounds(monthValue) {
  const fallback = defaultMonthValue();
  const value = monthValue || fallback;
  const parts = value.split("-");
  const year = Number(parts[0]);
  const month = Number(parts[1]);

  if (!year || !month) {
    return monthBounds(fallback);
  }

  const start = year + "-" + String(month).padStart(2, "0") + "-01";
  const nextMonth = month === 12 ? 1 : month + 1;
  const nextYear = month === 12 ? year + 1 : year;
  const end = nextYear + "-" + String(nextMonth).padStart(2, "0") + "-01";
  return { start, end, label: value };
}

function formatDateDe(dateValue) {
  if (!dateValue) return "-";
  const parts = String(dateValue).split("-");
  if (parts.length === 3) return parts[2] + "." + parts[1] + "." + parts[0];
  return dateValue;
}

function formatKm(value) {
  const km = Number(value || 0);
  return km.toLocaleString("de-DE", {
    minimumFractionDigits: 0,
    maximumFractionDigits: 1
  }) + " km";
}


function setCustomerExportStatus(text, ok) {
  const el = document.getElementById("customerExportStatus");
  if (!el) return;
  el.textContent = text || "\u00A0";
  el.style.color = ok ? "#6bd86b" : "#ff6b3d";
}

function safeFileName(value) {
  return String(value || "").trim().toLowerCase()
    .replace(/[ae]/g, "ae").replace(/[oe]/g, "oe").replace(/[ue]/g, "ue").replace(/[ss]/g, "ss")
    .replace(/[^a-z0-9_-]+/g, "-").replace(/^-+|-+$/g, "") || "ohne-name";
}

function csvEscape(value) {
  const text = value === null || value === undefined ? "" : String(value);
  return '"' + text.replace(/"/g, '""') + '"';
}

function toCsv(items) {
  if (!items || !items.length) return "";
  const keys = Array.from(items.reduce((set, item) => {
    Object.keys(item || {}).forEach(key => set.add(key));
    return set;
  }, new Set()));
  const lines = [keys.map(csvEscape).join(";")];
  items.forEach(item => {
    lines.push(keys.map(key => csvEscape(typeof item[key] === "object" ? JSON.stringify(item[key]) : item[key])).join(";"));
  });
  return lines.join("\r\n");
}

function customerLabel(customer) {
  return customer.firma || [customer.vorname, customer.nachname].filter(Boolean).join(" ") || customer.email || "Kunde";
}

function sameCustomerName(a, b) {
  return String(a || "").trim().toLowerCase() === String(b || "").trim().toLowerCase();
}

async function fetchCompanyRows(table) {
  const { data, error } = await db.from(table).select("*").eq("company_id", authContext.company_id);
  if (error) {
    console.log(error);
    return [];
  }
  return data || [];
}

function downloadBlob(blob, fileName) {
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = fileName;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function downloadCustomerDataArchive() {
  if (!authContext || !authContext.company_id) return;
  if (!window.JSZip) {
    setCustomerExportStatus("ZIP-Modul konnte nicht geladen werden.", false);
    return;
  }

  setCustomerExportStatus("Kundendaten werden gesammelt...", true);
  const [customers, projects, orders, reports, documents, images] = await Promise.all([
    fetchCompanyRows("customers"),
    fetchCompanyRows("projects"),
    fetchCompanyRows("auftraege"),
    fetchCompanyRows("stundennachweise"),
    fetchCompanyRows("project_documents"),
    fetchCompanyRows("project_images")
  ]);

  const zip = new JSZip();
  const root = zip.folder("bautrail-kundendaten");
  const generatedAt = new Date().toISOString();

  root.file("README.txt", [
    "bautrail Kundendaten Export",
    "Erstellt am: " + generatedAt,
    "Firma: " + (company && company.name ? company.name : authContext.company_id),
    "",
    "Dieser ZIP-Ordner enthaelt CSV- und JSON-Dateien fuer Kunden, Projekte, Auftraege und Stundennachweise.",
    "Dokumente und Bilder werden als Metadaten mit Datei-URLs exportiert."
  ].join("\r\n"));

  const allFolder = root.folder("00_gesamt");
  allFolder.file("kunden.csv", toCsv(customers));
  allFolder.file("projekte.csv", toCsv(projects));
  allFolder.file("auftraege.csv", toCsv(orders));
  allFolder.file("stundennachweise.csv", toCsv(reports));
  allFolder.file("dokumente.csv", toCsv(documents));
  allFolder.file("bilder.csv", toCsv(images));
  allFolder.file("alles.json", JSON.stringify({ generatedAt, company, customers, projects, orders, reports, documents, images }, null, 2));

  const customerRoot = root.folder("kunden");
  customers.forEach((customer, index) => {
    const label = customerLabel(customer);
    const folder = customerRoot.folder(String(index + 1).padStart(3, "0") + "-" + safeFileName(label));
    const customerName = customerLabel(customer);
    const customerProjects = projects.filter(project => String(project.customer_id || "") === String(customer.id || "") || sameCustomerName(project.customer, customerName));
    const projectIds = new Set(customerProjects.map(project => String(project.id || "")));
    const customerOrders = orders.filter(order => String(order.customer_id || "") === String(customer.id || "") || sameCustomerName(order.customer, customerName));
    const customerReports = reports.filter(report => String(report.customer_id || "") === String(customer.id || "") || sameCustomerName(report.customer, customerName));
    const customerDocuments = documents.filter(doc => projectIds.has(String(doc.project_id || "")));
    const customerImages = images.filter(image => projectIds.has(String(image.project_id || "")));

    folder.file("kunde.json", JSON.stringify(customer, null, 2));
    folder.file("projekte.csv", toCsv(customerProjects));
    folder.file("auftraege.csv", toCsv(customerOrders));
    folder.file("stundennachweise.csv", toCsv(customerReports));
    folder.file("dokumente.csv", toCsv(customerDocuments));
    folder.file("bilder.csv", toCsv(customerImages));
    folder.file("daten.json", JSON.stringify({ customer, projects: customerProjects, orders: customerOrders, reports: customerReports, documents: customerDocuments, images: customerImages }, null, 2));
  });

  const blob = await zip.generateAsync({ type: "blob" });
  const date = new Date().toISOString().slice(0, 10);
  downloadBlob(blob, "bautrail-kundendaten-" + date + ".zip");
  setCustomerExportStatus("Download erstellt: " + customers.length + " Kunden exportiert.", true);
}

async function loadCompany() {
  const { data, error } = await db
    .from("companies")
    .select("*")
    .eq("id", authContext.company_id)
    .maybeSingle();

  if (error || !data) {
    console.log(error);
    document.getElementById("roleInfo").textContent = "Firma konnte nicht geladen werden.";
    return;
  }

  company = data;
  document.getElementById("companySubline").textContent = company.name || "Firmensteuerung";
  document.getElementById("roleInfo").textContent =
    "Angemeldet als " + (authContext.name || authContext.email || "Chef") + " | Firma: " + (company.name || "-");
}

async function createInvite() {
  if (!authContext || !authContext.company_id) return;

  const role = document.getElementById("inviteRole").value;
  let lastError = null;
  let createdCode = "";

  for (let i = 0; i < 6; i += 1) {
    const invite_code = randomInviteCode();
    const { error } = await db
      .from("company_invites")
      .insert([{
        company_id: authContext.company_id,
        invite_code,
        role,
        created_by: authContext.user_id,
        active: true,
        expires_at: new Date(Date.now() + 14 * 24 * 60 * 60 * 1000).toISOString()
      }]);
    if (!error) {
      createdCode = invite_code;
      break;
    }
    lastError = error;
    const msg = String(error.message || "").toLowerCase();
    if (!msg.includes("duplicate") && !msg.includes("unique")) break;
  }

  if (!createdCode) {
    console.log(lastError);
    setInviteStatus("Code konnte nicht erstellt werden: " + ((lastError && lastError.message) || "Fehler"), false);
    return;
  }

  document.getElementById("inviteResult").textContent = createdCode;
  setInviteStatus("Code erstellt. Du kannst ihn direkt kopieren.", true);
}

async function loadMembers() {
  const list = document.getElementById("memberList");
  list.innerHTML = "<p style='opacity:0.7;'>Lade Team...</p>";

  const { data, error } = await db
    .from("company_members")
    .select("*")
    .eq("company_id", authContext.company_id)
    .order("created_at", { ascending: true });

  if (error) {
    console.log(error);
    list.innerHTML = "<p style='opacity:0.7;'>Team konnte nicht geladen werden.</p>";
    return;
  }

  if (!(data || []).length) {
    membersCache = [];
    list.innerHTML = "<p style='opacity:0.7;'>Noch keine Mitglieder.</p>";
    return;
  }

  membersCache = data || [];
  list.innerHTML = "";
  (data || []).forEach(member => {
    const card = document.createElement("div");
    card.className = "info-box";
    card.style.marginBottom = "8px";
    card.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
        <div>
          <strong>${member.name || member.email || "Mitarbeiter"}</strong><br>
          <small>${member.role} | ${member.active ? "aktiv" : "deaktiviert"} | ${member.job_type || "ohne Typ"}</small>
          <div style="margin-top:8px;display:flex;gap:8px;">
            <select id="jobtype_${member.id}" class="compact-input" style="min-height:38px;padding:8px 10px;">
              <option value="">Typ waehlen</option>
              <option value="Meister" ${member.job_type === "Meister" ? "selected" : ""}>Meister</option>
              <option value="Monteur" ${member.job_type === "Monteur" ? "selected" : ""}>Monteur</option>
              <option value="Helfer" ${member.job_type === "Helfer" ? "selected" : ""}>Helfer</option>
            </select>
            <button class="login-btn" style="width:auto;margin:0;padding:8px 10px;background:#444;" onclick="saveMemberJobType('${member.id}')">Speichern</button>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;min-width:116px;">
          <button class="login-btn" style="width:auto;margin:0;padding:10px 12px;background:${member.active ? "#444" : "#ff6b3d"};" onclick="toggleMember('${member.id}', ${member.active ? "false" : "true"})">
            ${member.active ? "Deaktivieren" : "Aktivieren"}
          </button>
          <button class="delete-btn" style="width:auto;margin:0;padding:10px 12px;" onclick="deleteMemberAccount('${member.user_id}')">Loeschen</button>
        </div>
      </div>
    `;
    list.appendChild(card);
  });
}


window.deleteMemberAccount = async function(userId) {
  if (!userId) return;
  if (String(userId) === String(authContext.user_id)) {
    alert("Deinen eigenen Account loeschst du in den Einstellungen.");
    return;
  }
  const member = (membersCache || []).find(item => String(item.user_id) === String(userId));
  const label = member ? (member.name || member.email || "diesem Mitarbeiter") : "diesem Mitarbeiter";
  const ok = confirm("Account von " + label + " dauerhaft loeschen?");
  if (!ok) return;
  const typed = prompt("Bitte LOESCHEN eingeben, um den Account zu loeschen:");
  if (String(typed || "").trim().toUpperCase() !== "LOESCHEN") return;

  const { error } = await db.rpc("delete_company_member_account", { p_user_id: userId });
  if (error) {
    console.log(error);
    alert("Account konnte nicht geloescht werden: " + (error.message || "Fehler"));
    return;
  }
  await loadMembers();
  await loadMileageOverview();
};

window.toggleMember = async function(memberId, targetActive) {
  const { error } = await db
    .from("company_members")
    .update({ active: targetActive })
    .eq("id", memberId)
    .eq("company_id", authContext.company_id);

  if (error) {
    console.log(error);
    alert("Status konnte nicht geaendert werden.");
    return;
  }

  await loadMembers();
  await loadMileageOverview();
};

window.saveMemberJobType = async function(memberId) {
  const select = document.getElementById("jobtype_" + memberId);
  const jobType = select ? select.value : "";

  const { error } = await db
    .from("company_members")
    .update({ job_type: jobType || null })
    .eq("id", memberId)
    .eq("company_id", authContext.company_id);

  if (error) {
    console.log(error);
    alert("Mitarbeiter-Typ konnte nicht gespeichert werden.");
    return;
  }

  await loadMembers();
  await loadMileageOverview();
};

async function loadMileageOverview() {
  const overview = document.getElementById("mileageOverview");
  const monthInput = document.getElementById("mileageMonth");
  if (!overview || !authContext || !authContext.company_id) return;

  if (monthInput && !monthInput.value) {
    monthInput.value = defaultMonthValue();
  }

  const { start, end, label } = monthBounds(monthInput ? monthInput.value : "");
  overview.innerHTML = "<p style='opacity:0.7;'>Lade Kilometer...</p>";

  const { data, error } = await db
    .from("stundennachweise")
    .select("*")
    .eq("company_id", authContext.company_id)
    .gte("arbeitsdatum", start)
    .lt("arbeitsdatum", end)
    .is("deleted_at", null)
    .order("arbeitsdatum", { ascending: true });

  if (error) {
    console.log(error);
    overview.innerHTML = "<p style='opacity:0.7;'>Kilometer konnten nicht geladen werden.</p>";
    return;
  }

  const activeMembers = (membersCache || []).filter(member => member.active !== false);
  if (!activeMembers.length) {
    overview.innerHTML = "<p style='opacity:0.7;'>Noch keine aktiven Mitarbeiter.</p>";
    return;
  }

  const reportsByUser = new Map();
  (data || []).forEach(report => {
    const userId = String(report.created_by || "");
    if (!userId) return;
    const km = Number(report.gefahrene_kilometer || 0);
    if (!km) return;
    if (!reportsByUser.has(userId)) {
      reportsByUser.set(userId, []);
    }
    reportsByUser.get(userId).push({
      date: report.arbeitsdatum || "",
      km,
      customer: report.customer || "",
      objekt: report.objekt || ""
    });
  });

  const monthTotal = Array.from(reportsByUser.values())
    .flat()
    .reduce((sum, report) => sum + report.km, 0);

  overview.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;">
      <small style="opacity:0.75;">Monat ${escapeHtml(label)}</small>
      <strong>${formatKm(monthTotal)}</strong>
    </div>
  `;

  activeMembers.forEach(member => {
    const userId = String(member.user_id || "");
    const reports = reportsByUser.get(userId) || [];
    const byDay = new Map();

    reports.forEach(report => {
      const day = report.date || "-";
      const current = byDay.get(day) || {
        km: 0,
        entries: []
      };
      current.km += report.km;
      current.entries.push(report);
      byDay.set(day, current);
    });

    const dayRows = Array.from(byDay.entries())
      .sort((a, b) => String(a[0]).localeCompare(String(b[0])))
      .map(([day, value]) => {
        const details = value.entries
          .map(entry => [entry.customer, entry.objekt].filter(Boolean).join(" - "))
          .filter(Boolean)
          .slice(0, 2)
          .map(escapeHtml)
          .join("<br>");
        return `
          <div style="display:grid;grid-template-columns:92px 1fr auto;gap:8px;align-items:start;padding:8px 0;border-top:1px solid #3a3a3a;">
            <small>${formatDateDe(day)}</small>
            <small style="opacity:0.75;">${details || value.entries.length + " Nachweis(e)"}</small>
            <strong>${formatKm(value.km)}</strong>
          </div>
        `;
      })
      .join("");

    const total = reports.reduce((sum, report) => sum + report.km, 0);
    const card = document.createElement("div");
    card.className = "info-box";
    card.style.marginBottom = "8px";
    card.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
        <div>
          <strong>${escapeHtml(member.name || member.email || "Mitarbeiter")}</strong><br>
          <small>${escapeHtml(member.role || "-")} | ${reports.length ? byDay.size + " Tag(e)" : "keine Kilometer"}</small>
        </div>
        <strong>${formatKm(total)}</strong>
      </div>
      <div style="margin-top:8px;">
        ${dayRows || "<small style='opacity:0.7;'>Keine Kilometer in diesem Monat erfasst.</small>"}
      </div>
    `;
    overview.appendChild(card);
  });
}

async function loadOpenTimesheets() {
  const list = document.getElementById("timesheetList");
  list.innerHTML = "<p style='opacity:0.7;'>Lade Stundenzettel...</p>";

  const { data, error } = await db
    .from("employee_timesheets")
    .select("*")
    .eq("company_id", authContext.company_id)
    .eq("status", "eingereicht")
    .order("created_at", { ascending: false })
    .limit(20);

  if (error) {
    console.log(error);
    list.innerHTML = "<p style='opacity:0.7;'>Stundenzettel konnten nicht geladen werden.</p>";
    return;
  }

  if (!(data || []).length) {
    list.innerHTML = "<p style='opacity:0.7;'>Keine eingereichten Stundenzettel.</p>";
    return;
  }

  list.innerHTML = "";
  (data || []).forEach(item => {
    const card = document.createElement("div");
    card.className = "info-box";
    card.style.marginBottom = "8px";
    card.innerHTML = `
      <strong>${item.note || "Stundenzettel"}</strong><br>
      <small>${item.start_time ? new Date(item.start_time).toLocaleString("de-DE") : "-"} bis ${item.end_time ? new Date(item.end_time).toLocaleString("de-DE") : "-"}</small>
      <div class="button-row" style="margin-top:8px;">
        <button class="login-btn" style="margin-bottom:0;" onclick="reviewTimesheet('${item.id}','genehmigt')">Genehmigen</button>
        <button class="delete-btn" style="margin:0;" onclick="reviewTimesheet('${item.id}','abgelehnt')">Ablehnen</button>
      </div>
    `;
    list.appendChild(card);
  });
}

window.reviewTimesheet = async function(timesheetId, status) {
  const { error } = await db
    .from("employee_timesheets")
    .update({
      status,
      approved_by: authContext.user_id
    })
    .eq("id", timesheetId)
    .eq("company_id", authContext.company_id);

  if (error) {
    console.log(error);
    alert("Konnte nicht speichern.");
    return;
  }

  await loadOpenTimesheets();
};

(async function() {
  authContext = await window.BaudokuAuthContext.loadAuthContext();
  if (!authContext) {
    window.location.href = "login.html";
    return;
  }
  if (!window.BaudokuAuthContext.requireRole(authContext, ["chef"])) {
    window.location.href = window.BaudokuAuthContext.dashboardPathForRole(authContext.role);
    return;
  }
  await loadCompany();
  await loadMembers();
  await loadMileageOverview();
  await loadOpenTimesheets();
