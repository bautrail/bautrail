<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#ff6b3d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Baudoku">
  <link rel="icon" href="assets/app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
</head>
<body>
<div class="app-wrapper">
  <div class="app-content">
    <header class="app-header">
      <h1 class="app-name">Profil</h1>
      <p class="company-name">Einstellungen und Rolle</p>
      <p id="headerRoleBadge" style="display:inline-block;margin-top:8px;padding:6px 10px;border-radius:999px;background:#2b2b2b;color:#fff;font-size:12px;">Rolle: -</p>
    </header>

    <div class="task-card" id="companySettingsCard" style="display:none;">
      <h3>Firma Einstellungen</h3>
      <p style="font-size:12px;opacity:0.75;margin-top:8px;">Firmendaten zentral verwalten</p>
      <button class="login-btn" style="margin-top:8px;" onclick="window.location.href='firma-einstellungen.html'">Oeffnen</button>
    </div>

    <div class="task-card">
      <h3>Wecker Einstellungen</h3>
      <p style="font-size:12px;opacity:0.75;margin-top:8px;">Zeiten fuer Benachrichtigungen einstellen</p>
      <button class="login-btn" style="margin-top:8px;" onclick="window.location.href='wecker-einstellungen.html'">Oeffnen</button>
    </div>

    <div class="task-card">
      <h3>System Rolle</h3>
      <p style="font-size:12px;opacity:0.75;margin-top:8px;">Rolle waehlen und Einladungscode nutzen</p>
      <button class="login-btn" style="margin-top:8px;" onclick="window.location.href='system-rolle.html'">Oeffnen</button>
    </div>

    <div class="task-card">
      <h3>Dein Name</h3>
      <input id="profileNameInput" class="compact-input" placeholder="Dein Name" style="margin-top:8px;">
      <button class="login-btn" style="margin-top:8px;" onclick="saveProfileName()">Namen speichern</button>
      <p id="nameStatus" style="font-size:12px;opacity:0.8;min-height:18px;">&nbsp;</p>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html"><span>&#127968;</span><small>&Uuml;bersicht</small></a>
    <a href="kunden.html"><span>&#128101;</span><small>Kunden</small></a>
    <a href="zeiten.html"><span>&#9201;&#65039;</span><small>Zeiten</small></a>
    <a href="profil.html" class="active"><span>&#128100;</span><small>Profil</small></a>
  </nav>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="auth-context.js"></script>
<script>
let authContext = null;
let memberRowId = null;

function setNameStatus(text, ok) {
  const el = document.getElementById("nameStatus");
  el.textContent = text || "\u00A0";
  el.style.color = ok ? "#4caf50" : "#ff3b3b";
}

async function loadProfileName() {
  if (!authContext || !authContext.user_id) return;
  const { data, error } = await db
    .from("company_members")
    .select("id, name, company_id")
    .eq("user_id", authContext.user_id)
    .eq("active", true)
    .order("created_at", { ascending: true })
    .limit(1)
    .maybeSingle();

  if (error) {
    console.log(error);
    return;
  }
  if (!data) return;

  memberRowId = data.id;
  document.getElementById("profileNameInput").value = data.name || "";
}

async function saveProfileName() {
  const name = String(document.getElementById("profileNameInput").value || "").trim();

  if (!authContext || !authContext.user_id) {
    setNameStatus("Keine Session gefunden.", false);
    return;
  }

  if (!memberRowId) {
    await loadProfileName();
  }

  if (!memberRowId) {
    setNameStatus("Keine Firmen-Zuordnung gefunden.", false);
    return;
  }

  const { error } = await db
    .from("company_members")
    .update({ name: name || null })
    .eq("id", memberRowId);

  if (error) {
    console.log(error);
    setNameStatus("Name konnte nicht gespeichert werden.", false);
    return;
  }

  setNameStatus("Gespeichert", true);
}

(async function() {
  const ctx = window.BaudokuAuthContext
    ? await window.BaudokuAuthContext.loadAuthContext({ noCache: true })
    : null;

  authContext = ctx;
  const role = ctx && ctx.role ? ctx.role : "-";
  document.getElementById("headerRoleBadge").textContent = "Rolle: " + role;
  document.getElementById("companySettingsCard").style.display = role === "chef" ? "block" : "none";
  await loadProfileName();
})();
</script>
<script src="pwa.js"></script>
</body>
</html>
