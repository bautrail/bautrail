textarea{

.week-day{

.week-day-head{

.week-employee-slot{

.week-employee-name{

function filterKunden() {

  const input =
    document.getElementById("kundenSearch");

  const dropdown =
    document.getElementById("kundenDropdown");

  const value =
    input.value.toLowerCase();

  dropdown.innerHTML = "";

  if(!value) return;

  const kunden =
    JSON.parse(
      localStorage.getItem("customers")
    ) || [];

  const filtered =
    kunden.filter(kunde => {

      const name =
        (
          kunde.firma ||
          (
            kunde.vorname + " " +
            kunde.nachname
          )
        ).toLowerCase();

      return name.includes(value);
    });

  filtered.forEach(kunde => {

    const name =
      kunde.firma ||
      (
        kunde.vorname + " " +
        kunde.nachname
      );

    const div =
      document.createElement("div");

    div.className = "plan-item";

    div.style.cursor = "pointer";

    div.innerHTML = `
      <div>
        <strong>${name}</strong>
      </div>
    `;

    div.onclick = () => {

      addKunde(name, kunde.id);

      dropdown.innerHTML = "";

      input.value = "";

      document.getElementById(
  "projektRow"
).style.display = "flex";
    };

    dropdown.appendChild(div);

  });
}



// =======================
// KUNDE HINZUFUeGEN
// =======================

function addKunde(name, kundeId) {

  let kunden =
    JSON.parse(
      localStorage.getItem(kundenKey)
    ) || [];

  const exists =
    kunden.find(
      k => k.id === kundeId
    );

  if(exists) return;

  kunden.push({
    id: kundeId,
    name: name
  });

  localStorage.setItem(
    kundenKey,
    JSON.stringify(kunden)
  );

  loadKunden();
}


// =======================
// KUNDEN LADEN
// =======================

function loadKunden() {

  kundenList.innerHTML = "";

  const kunden =
    JSON.parse(
      localStorage.getItem(kundenKey)
    ) || [];

  kunden.forEach((kunde,index) => {

    const div =
      document.createElement("div");

    div.className = "plan-item";

    div.innerHTML = `
      <div>
        <strong>${kunde.name}</strong>
      </div>

      <button
        class="delete-btn"
        onclick="deleteKunde(${index})"
      >
        ✖
      </button>
    `;

    kundenList.appendChild(div);

  });
}

// =======================
// KUNDE LOeSCHEN
// =======================

function deleteKunde(index) {

  let kunden =
    JSON.parse(
      localStorage.getItem(kundenKey)
    ) || [];

  kunden.splice(index,1);

  localStorage.setItem(
    kundenKey,
    JSON.stringify(kunden)
  );

  loadKunden();
}

// =======================
// PROJEKTE SUCHEN
// =======================

function filterProjekte() {

  const input =
    document.getElementById("projektSearch");

  const dropdown =
    document.getElementById("projektDropdown");

  const value =
    input.value.toLowerCase();

  dropdown.innerHTML = "";

  if(!value) return;

  const kunden =
    JSON.parse(
      localStorage.getItem(kundenKey)
    ) || [];

  if(!kunden.length) return;

  const letzterKunde =
    kunden[kunden.length - 1];

  const projekte =
    JSON.parse(
      localStorage.getItem(
        "projects_" + letzterKunde.id
      )
    ) || [];

  const filtered =
    projekte.filter(projekt => {

      return (
        projekt.name || ""
      )
      .toLowerCase()
      .includes(value);

    });

  filtered.forEach(projekt => {

    const div =
      document.createElement("div");

    div.className = "plan-item";

    div.style.cursor = "pointer";

    div.innerHTML = `
      <div>
        <strong>${projekt.name}</strong>
      </div>
    `;

    div.onclick = () => {

      addProjekt(
        projekt.name,
        projekt.id
      );

      dropdown.innerHTML = "";

      input.value = "";
    };

    dropdown.appendChild(div);

  });

  document.getElementById(
    "projektRow"
  ).style.display = "flex";
}

let planningTab = "today";
let planningTodayItems = [];
let planningTomorrowItems = [];
let planningWeekItems = [];

function toDateKey(date) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");
  return [year, month, day].join("-");
}

function renderPlanningTab() {
  const list = document.getElementById("planningList");
  const count = document.getElementById("planningCount");
  if (!list || !count) return;

  const items =
    planningTab === "today"
      ? planningTodayItems
      : planningTab === "tomorrow"
      ? planningTomorrowItems
      : planningWeekItems;

  count.textContent = items.length + " Einträge";

  if (!items.length) {
    list.innerHTML = "<p style='opacity:0.7;'>Nichts offen.</p>";
    return;
  }

  list.innerHTML = "";
  items.forEach(item => {
    const div = document.createElement("div");
    div.className = "info-box";
    div.style.cursor = "pointer";
    div.style.marginBottom = "8px";
    div.innerHTML = `
      <small>${item.type}</small>
      <div class="text">${item.title}</div>
      <small>${item.subtitle || ""}</small>
    `;
    div.onclick = () => {
      window.location.href = item.href;
    };
    list.appendChild(div);
  });
  renderPlanningWeekBoard();
}

function setPlanningTab(tab, event) {
  planningTab = tab;
  document.querySelectorAll(".planning-tab-btn").forEach(btn => btn.classList.remove("active"));
  if (event && event.target) {
    event.target.classList.add("active");
  }
  renderPlanningTab();
}

async function loadPlanningTimeline() {
  const list = document.getElementById("planningList");

  if (!navigator.onLine || !window.db) {
    if (list) {
      list.innerHTML = "<p style='opacity:0.7;'>Planung wird online geladen.</p>";
    }
    return;
  }

  const [{ data: jobs }, { data: projects }] = await Promise.all([
    db.from("auftraege").select("*").order("faelligkeit", { ascending: true }),
    db.from("projects").select("*").order("faelligkeit", { ascending: true })
  ]);

  const now = new Date();
  const todayKey = toDateKey(now);
  const tomorrow = new Date(now);
  tomorrow.setDate(tomorrow.getDate() + 1);
  const tomorrowKey = toDateKey(tomorrow);
  const weekLimit = new Date(now);
  weekLimit.setDate(weekLimit.getDate() + 7);

  planningTodayItems = [];
  planningTomorrowItems = [];
  planningWeekItems = [];

  (jobs || []).forEach(job => {
    const statusValue = job.status || (job.done ? "erledigt" : "offen");
    if (statusValue === "erledigt" || statusValue === "abgerechnet" || !job.faelligkeit) return;

    const dueDate = new Date(job.faelligkeit);
    const dueKey = toDateKey(dueDate);
    const item = {
      type: "Auftrag",
      title: (job.customer || "Kunde") + " - " + (job.project || "Projekt"),
      subtitle: job.beschreibung || "",
      href: "auftrag-detail.html?id=" + job.id
    };

    if (dueKey === todayKey) planningTodayItems.push(item);
    if (dueKey === tomorrowKey) planningTomorrowItems.push(item);
    if (dueDate >= now && dueDate <= weekLimit) planningWeekItems.push(item);
  });

  (projects || []).forEach(project => {
    if (!project.faelligkeit) return;

    const dueDate = new Date(project.faelligkeit);
    const dueKey = toDateKey(dueDate);
    const item = {
      type: "Projekt",
      title: project.name || "Projekt",
      subtitle: project.customer || "",
      href: "projekt-detail.html?id=" + project.id
    };

    if (dueKey === todayKey) planningTodayItems.push(item);
    if (dueKey === tomorrowKey) planningTomorrowItems.push(item);
    if (dueDate >= now && dueDate <= weekLimit) planningWeekItems.push(item);
  });

  renderPlanningTab();
}

loadPlanningTimeline();

let planningCtx = null;
let planningAssignments = [];
let planningIsManager = false;
let planningWeekStart = startOfWeek(new Date());
let planningData = {
  members: [],
  customers: [],
  projects: []
};

function startOfWeek(date) {
  const d = new Date(date);
  d.setHours(0, 0, 0, 0);
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  return d;
}

function addDays(date, days) {
  const d = new Date(date);
  d.setDate(d.getDate() + days);
  return d;
}

function formatDateInputValue(date) {
  return [date.getFullYear(), String(date.getMonth() + 1).padStart(2, "0"), String(date.getDate()).padStart(2, "0")].join("-");
}

function formatWeekLabel(start) {
  const endDate = addDays(start, 6);
  return start.toLocaleDateString("de-DE") + " bis " + endDate.toLocaleDateString("de-DE");
}

function weekDates() {
  return Array.from({ length: 7 }, (_, idx) => addDays(planningWeekStart, idx));
}

async function loadScopedRows(table, ctx) {
  if (!(ctx && ctx.company_id)) return [];
  const scoped = await db
    .from(table)
    .select("*")
    .eq("company_id", ctx.company_id)
    .order("created_at", { ascending: false });
  if (scoped.error) {
    console.log(scoped.error);
    return [];
  }
  return scoped.data || [];
}

async function loadPlanningDataNew(ctx, isManager) {
  planningCtx = ctx;
  planningIsManager = !!isManager;
  if (isManager) {
    const [members, customers, projects] = await Promise.all([
      db.from("company_members")
        .select("id, user_id, name, email, role, active")
        .eq("company_id", ctx.company_id)
        .eq("active", true)
        .eq("role", "angestellter")
        .order("name", { ascending: true }),
      loadScopedRows("customers", ctx),
      loadScopedRows("projects", ctx)
    ]);

    planningData.members = (members.data || []);
    planningData.customers = customers || [];
    planningData.projects = projects || [];
    fillPlanningSelects();
  } else {
    planningData.members = [{ user_id: ctx.user_id, name: ctx.name || ctx.email || "Ich" }];
  }
  await loadAssignedListNew(ctx, isManager);
}

function fillPlanningSelects() {
  const employeeSel = document.getElementById("planEmployee");
  const customerSel = document.getElementById("planCustomer");
  const projectSel = document.getElementById("planProject");
  if (!employeeSel || !customerSel || !projectSel) return;

  employeeSel.innerHTML =
    "<option value=''>Mitarbeiter wählen</option>" +
    planningData.members.map(m => `<option value="${m.user_id}">${m.name || m.email || "Mitarbeiter"}</option>`).join("");

  customerSel.innerHTML =
    "<option value=''>Kunde wählen</option>" +
    planningData.customers.map(c => {
      const label = c.firma || [c.vorname, c.nachname].filter(Boolean).join(" ") || "Kunde";
      return `<option value="${c.id}">${label}</option>`;
    }).join("");

  customerSel.addEventListener("change", () => {
    const id = customerSel.value;
    let list = planningData.projects.filter(p => String(p.customer_id) === String(id));
    if (!list.length) list = planningData.projects;
    projectSel.innerHTML =
      "<option value=''>Projekt wählen</option>" +
      list.map(p => `<option value="${p.id}">${p.name || "Projekt"}</option>`).join("");
  });

  projectSel.innerHTML =
    "<option value=''>Projekt wählen</option>" +
    planningData.projects.map(p => `<option value="${p.id}">${p.name || "Projekt"}</option>`).join("");

  const d = document.getElementById("planDate");
  if (d) d.value = formatDateInputValue(new Date());
}

window.assignPlanEntry = async function() {
  const status = document.getElementById("planStatus");
  if (!planningCtx) return;
  const assigned_to = (document.getElementById("planEmployee") || {}).value || "";
  const customer_id = (document.getElementById("planCustomer") || {}).value || "";
  const project_id = (document.getElementById("planProject") || {}).value || "";
  const date = (document.getElementById("planDate") || {}).value || null;

  if (!assigned_to || !customer_id || !project_id || !date) {
    if (status) {
      status.textContent = "Bitte Mitarbeiter, Kunde, Projekt und Datum auswählen.";
      status.style.color = "#ff6b3d";
    }
    return;
  }

  const customer = planningData.customers.find(c => String(c.id) === String(customer_id));
  const project = planningData.projects.find(p => String(p.id) === String(project_id));
  const title = (customer ? (customer.firma || [customer.vorname, customer.nachname].filter(Boolean).join(" ")) : "Kunde")
    + " - " + (project ? (project.name || "Projekt") : "Projekt");

  const payload = {
    company_id: planningCtx.company_id,
    assigned_to,
    project_id,
    title,
    description: "",
    date,
    created_by: planningCtx.user_id
  };

  const { error } = await db.from("planning_entries").insert([payload]);
  if (error) {
    console.log(error);
    if (status) {
      status.textContent = "Zuweisung fehlgeschlagen.";
      status.style.color = "#ff6b3d";
    }
    return;
  }

  if (status) {
    status.textContent = "Planung gespeichert.";
    status.style.color = "#9be15d";
  }
  await loadAssignedListNew(planningCtx, true);
};

async function loadAssignedListNew(ctx, isManager) {
  const host = document.getElementById("planningAssignedList");
  if (!host) return;

  let query = db.from("planning_entries").select("*").order("date", { ascending: true }).limit(100);
  if (ctx.company_id) query = query.eq("company_id", ctx.company_id);
  if (!isManager) query = query.eq("assigned_to", ctx.user_id);

  const { data, error } = await query;
  if (error) {
    console.log(error);
    host.innerHTML = "<p style='opacity:0.7;'>Planung konnte nicht geladen werden.</p>";
    return;
  }

  planningAssignments = data || [];
  const memberMap = new Map((planningData.members || []).map(m => [String(m.user_id), m.name || m.email || "Mitarbeiter"]));
  if (!(data || []).length) {
    host.innerHTML = "<p style='opacity:0.7;'>Keine Einträge vorhanden.</p>";
    return;
  }

  host.innerHTML = "";
  (data || []).forEach(item => {
    const card = document.createElement("div");
    card.className = "info-box";
    card.style.marginBottom = "8px";
    const managerActions = isManager
      ? `
        <div class="button-row" style="margin-top:8px;">
          <button class="login-btn" style="margin:0;background:#444;" onclick="editPlanEntry('${item.id}')">Bearbeiten</button>
          <button class="delete-btn" style="margin:0;" onclick="deletePlanEntry('${item.id}')">Löschen</button>
        </div>
      `
      : "";
    card.innerHTML = `
      <strong>${item.title || "Planung"}</strong><br>
      <small>${item.date || "-"}${isManager ? " | " + (memberMap.get(String(item.assigned_to)) || "Mitarbeiter") : ""}</small>
      ${managerActions}
    `;
    host.appendChild(card);
  });
  renderPlanningWeekBoard();
}

function renderPlanningWeekBoard() {
  const host = document.getElementById("planningWeekBoard");
  const label = document.getElementById("planningWeekLabel");
  if (!host || !label) return;
  label.textContent = formatWeekLabel(planningWeekStart);

  const dates = weekDates();
  const members = planningIsManager
    ? (planningData.members.length ? planningData.members : [])
    : [{ user_id: planningCtx ? planningCtx.user_id : "", name: planningCtx ? (planningCtx.name || planningCtx.email || "Ich") : "Ich" }];

  host.innerHTML = "";

  dates.forEach(date => {
    const dayKey = formatDateInputValue(date);
    const day = document.createElement("div");
    day.className = "week-day";
    day.innerHTML = `<div class="week-day-head"><strong>${date.toLocaleDateString("de-DE", { weekday: "short" })}</strong><small>${date.toLocaleDateString("de-DE")}</small></div>`;

    members.forEach(member => {
      const slot = document.createElement("div");
      slot.className = "week-employee-slot";
      slot.dataset.date = dayKey;
      slot.dataset.userId = member.user_id || "";
      slot.innerHTML = `<div class="week-employee-name">${member.name || member.email || "Mitarbeiter"}</div>`;

      const items = planningAssignments.filter(item => String(item.assigned_to || "") === String(member.user_id || "") && String(item.date || "") === dayKey);
      if (!items.length) {
        const empty = document.createElement("div");
        empty.className = "week-empty";
        empty.textContent = planningIsManager ? "Eintrag hierher ziehen" : "Frei";
        slot.appendChild(empty);
      } else {
        items.forEach(item => {
          const entry = document.createElement("div");
          entry.className = "week-entry";
          entry.draggable = planningIsManager;
          entry.dataset.id = item.id;
          entry.innerHTML = `<strong>${item.title || "Planung"}</strong><small>${item.description || item.date || ""}</small>`;
          if (planningIsManager) {
            entry.addEventListener("dragstart", ev => {
              ev.dataTransfer.setData("text/plain", String(item.id));
              ev.dataTransfer.effectAllowed = "move";
            });
          }
          slot.appendChild(entry);
        });
      }

      if (planningIsManager) {
        slot.addEventListener("dragover", ev => {
          ev.preventDefault();
          slot.classList.add("drag-over");
        });
        slot.addEventListener("dragleave", () => slot.classList.remove("drag-over"));
        slot.addEventListener("drop", async ev => {
          ev.preventDefault();
          slot.classList.remove("drag-over");
          const entryId = ev.dataTransfer.getData("text/plain");
          if (!entryId) return;
          await movePlanningEntry(entryId, slot.dataset.userId, slot.dataset.date);
        });
      }

      day.appendChild(slot);
    });

    host.appendChild(day);
  });
}

window.shiftPlanningWeek = function(delta) {
  if (!delta) planningWeekStart = startOfWeek(new Date());
  else planningWeekStart = addDays(planningWeekStart, delta);
  renderPlanningWeekBoard();
};

async function movePlanningEntry(id, assignedTo, date) {
  if (!planningCtx || !planningIsManager) return;
  const { error } = await db
    .from("planning_entries")
    .update({ assigned_to: assignedTo, date })
    .eq("id", id)
    .eq("company_id", planningCtx.company_id);
  const status = document.getElementById("planStatus");
  if (error) {
    console.log(error);
    if (status) {
      status.textContent = "Verschieben fehlgeschlagen.";
      status.style.color = "#ff6b3d";
    }
    return;
  }
  if (status) {
    status.textContent = "Planung verschoben.";
    status.style.color = "#9be15d";
  }
  await loadAssignedListNew(planningCtx, true);
}

window.editPlanEntry = async function(id) {
  if (!planningCtx) return;
  const list = await db
    .from("planning_entries")
    .select("*")
    .eq("id", id)
    .eq("company_id", planningCtx.company_id)
    .maybeSingle();
  if (list.error || !list.data) {
    console.log(list.error);
    return;
  }
  const row = list.data;
  const newDate = prompt("Neues Datum (YYYY-MM-DD):", row.date || "") || "";
  if (!newDate.trim()) return;
  const newTitle = prompt("Titel / Einsatz:", row.title || "") || "";
  if (!newTitle.trim()) return;

  const { error } = await db
    .from("planning_entries")
    .update({
      date: newDate.trim(),
      title: newTitle.trim()
    })
    .eq("id", id)
    .eq("company_id", planningCtx.company_id);

  if (error) {
    console.log(error);
    const status = document.getElementById("planStatus");
    if (status) {
      status.textContent = "Aendern fehlgeschlagen.";
      status.style.color = "#ff6b3d";
    }
    return;
  }

  const status = document.getElementById("planStatus");
  if (status) {
    status.textContent = "Eintrag aktualisiert.";
    status.style.color = "#9be15d";
  }
  await loadAssignedListNew(planningCtx, true);
};

window.deletePlanEntry = async function(id) {
  if (!planningCtx) return;
  const ok = confirm("Planungseintrag wirklich löschen?");
  if (!ok) return;

  const { error } = await db
    .from("planning_entries")
    .delete()
    .eq("id", id)
    .eq("company_id", planningCtx.company_id);

  if (error) {
    console.log(error);
    const status = document.getElementById("planStatus");
    if (status) {
      status.textContent = "Löschen fehlgeschlagen.";
      status.style.color = "#ff6b3d";
    }
    return;
  }

  const status = document.getElementById("planStatus");
  if (status) {
    status.textContent = "Eintrag gelöscht.";
    status.style.color = "#9be15d";
  }
  await loadAssignedListNew(planningCtx, true);
};

initRolePlanningNew();

</script>
